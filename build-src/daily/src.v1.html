<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queen's Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bungee+Inline&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>/*LEAFLET_CSS*/</style>
<style>
/* Layout: one phone-width column on the arcade-lobby night. Each round wears its party game's colours:
   Receipts = blue ground + paper slip, Showdown = navy marquee + gold, Drop the Pin = lake + stone map.
   The finish is a gold scorecard, then the prize wheels. */
:root{
  --night:#07060F; --night-2:#120F24; --night-3:#1C1836;
  --text:#F6F1E8; --muted:#A49FC0;
  --gold:#FFC83D; --gold-deep:#B97F05; --red:#FF3B4A; --red-deep:#A80F1D; --mint:#7FE0C4; --hi:#FFE63B;
  --blue:#2D4BFF; --paper:#F6F3EA; --stamp:#E3262B; --ink:#111111;
  --navy:#0A1036; --navy-2:#141D55; --tile:#2246E6; --tile-hi:#4F72FF; --cream:#FFF5DE;
  --lake:#0C2B35; --stone:#E6E0D2; --stone-2:#CFC6B2; --stone-3:#B5AA92; --park:#C7CDA8; --road:#FFFFFF; --water:#3E7F95; --pin:#FF5A1F; --amber:#FFB23F;
  --good:#3BD67A; --mid:#FFC83D; --low:#FF8A3D; --bad:#FF3B4A;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --marquee:"Bungee Inline","Bowlby One","Arial Black",sans-serif;
  --tall:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --ease-pop:cubic-bezier(.2,1.45,.4,1); --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--mono);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx .orb{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(100px);opacity:.22;will-change:transform}
.bgfx .a{left:-25vmax;top:-25vmax;background:var(--gold);animation:d1 14s ease-in-out infinite alternate}
.bgfx .b{right:-25vmax;bottom:-25vmax;background:var(--blue);animation:d2 16s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(10vmax,8vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-10vmax,-6vmax) scale(.9)}}
body[data-mode="receipts"] .bgfx .a{background:var(--blue)} body[data-mode="receipts"] .bgfx .b{background:var(--hi)}
body[data-mode="survey"] .bgfx .a{background:var(--tile)} body[data-mode="survey"] .bgfx .b{background:var(--gold)}
body[data-mode="pin"] .bgfx .a{background:var(--water)} body[data-mode="pin"] .bgfx .b{background:var(--pin)}
.wrap{position:relative;z-index:1;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 22px}
.screen{display:flex;flex-direction:column;gap:14px;flex:1;animation:screenin .45s var(--ease-out)}
@keyframes screenin{from{opacity:0;transform:translateY(14px)}}

/* HUD */
.hud{display:flex;align-items:center;gap:10px}
.hud .rn{font-family:var(--display);font-size:15px;letter-spacing:.04em;white-space:nowrap}
.hud .rn small{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.dots{display:flex;gap:4px;flex:1;min-width:0;justify-content:center}
.dots i{width:16px;height:6px;border-radius:3px;background:var(--night-3);transition:background .4s}
.dots i.done{background:var(--mint)} .dots i.now{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.score{font-family:var(--display);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
.score small{display:block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.hud .sound{width:36px;padding:0;justify-content:center;font-size:0;gap:0;flex:0 0 auto}
.sound{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.1em;box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--muted)}
.sound svg{width:16px;height:16px}

.btn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:0 20px;border-radius:16px;font-family:var(--display);font-size:20px;letter-spacing:.03em;
  background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--gold-deep);transition:transform .12s, box-shadow .12s, opacity .2s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--night-3)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 color-mix(in srgb, var(--mint) 50%, var(--ink))}
.lbl{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--muted)}

/* intro */
.intro{justify-content:center;gap:18px}
.back{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-decoration:none;padding:8px 0}
.kick{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--mint)}
.intro h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,16vw,92px);line-height:.86;text-wrap:balance;text-shadow:0 0 34px color-mix(in srgb, var(--gold) 45%, transparent)}
.intro h1 span{color:var(--gold)}
.intro .sub{margin:0;font-size:15px;line-height:1.45;font-weight:600;color:var(--muted)}
.intro .sub b{color:var(--text)}
.lineup{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lineup li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--night-2);font-weight:600;font-size:14px}
.lineup .tag{flex:0 0 auto;min-width:86px;text-align:center;padding:6px 8px;border-radius:8px;font-family:var(--display);font-size:13px;letter-spacing:.03em;color:var(--ink)}
.lineup .t-r{background:var(--blue);color:var(--paper)} .lineup .t-s{background:var(--gold)} .lineup .t-p{background:var(--pin)}
.lineup em{font-style:normal;margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.demo-note{margin:0;font-size:11px;color:var(--muted);line-height:1.4;text-align:center}

/* RECEIPTS round */
.slip{position:relative;background:var(--paper);color:var(--ink);padding:18px 18px 22px;margin-bottom:8px;border-radius:6px 6px 0 0;animation:slipin .55s var(--ease-pop)}
.slip::after{content:"";position:absolute;left:0;right:0;top:100%;height:9px;background:conic-gradient(from -45deg at 50% 100%, var(--paper) 90deg, transparent 0) 0 0 / 18px 9px repeat-x}
@keyframes slipin{from{transform:translateY(-30px) rotate(-1.5deg);opacity:0}}
.slip .head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.16em;border-bottom:2px dashed var(--ink);padding-bottom:8px;margin-bottom:12px}
.slip .q{margin:0;font-family:var(--tall);font-weight:900;font-size:clamp(30px,8.6vw,44px);line-height:1;text-transform:uppercase;text-wrap:balance}
.slip .said{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.12em;display:flex;gap:8px;align-items:center}
.slip .said b{padding:3px 8px;background:var(--ink);color:var(--paper);border-radius:4px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{min-height:96px;border-radius:18px;font-family:var(--display);font-size:38px;letter-spacing:.02em;color:var(--ink);transition:transform .15s var(--ease-pop)}
.yn .yes{background:var(--hi);box-shadow:0 7px 0 color-mix(in srgb, var(--hi) 50%, var(--ink))}
.yn .no{background:var(--paper);box-shadow:0 7px 0 var(--stone-3)}
.yn button:active{transform:translateY(5px)}
.pctwrap{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:color-mix(in srgb, var(--blue) 30%, var(--night-2));box-shadow:inset 0 0 0 2px var(--blue)}
.pctrow{display:flex;align-items:center;gap:10px}
.step{flex:0 0 auto;width:54px;height:54px;border-radius:14px;background:var(--night);font-family:var(--display);font-size:28px;box-shadow:inset 0 0 0 2px var(--muted)}
.pctbig{flex:1;text-align:center;font-family:var(--display);font-size:64px;line-height:1;color:var(--hi);font-variant-numeric:tabular-nums;text-shadow:0 0 24px color-mix(in srgb, var(--hi) 50%, transparent)}
input[type=range]{width:100%;accent-color:var(--hi);height:34px}
.meter{position:relative;height:56px;border-radius:12px;background:var(--night);overflow:visible;box-shadow:inset 0 0 0 2px var(--paper)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:var(--hi);transition:width 1.4s cubic-bezier(.3,0,.2,1)}
.meter .fillv{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:24px;color:var(--ink);z-index:2;mix-blend-mode:normal}
.meter .you{position:absolute;top:-10px;bottom:-10px;width:4px;margin-left:-2px;background:var(--stamp);border-radius:2px;z-index:3;opacity:0;transition:opacity .3s .2s}
.meter .you span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.12em;white-space:nowrap;color:var(--text);padding-bottom:2px}
.verdict{align-self:center;display:inline-block;padding:6px 14px;background:var(--stamp);color:var(--paper);font-family:var(--display);font-size:22px;letter-spacing:.04em;transform:rotate(-3deg);box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--stamp);animation:stampin .45s var(--ease-pop)}
.verdict.good{background:var(--good);box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--good);color:var(--ink)}
@keyframes stampin{from{transform:rotate(-14deg) scale(2.6);opacity:0}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{padding:10px 12px;border-radius:12px;background:var(--night-2)}
.facts small{display:block;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
.facts b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.pts{align-self:center;font-family:var(--display);font-size:44px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 20px color-mix(in srgb, var(--gold) 50%, transparent)}
.pts small{font-size:16px;color:var(--muted)}

/* SURVEY round */
.qcard{padding:12px 14px;border-radius:14px;background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep)}
.qcard .asked{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--red)}
.qcard p{margin:4px 0 0;font-family:var(--tall);font-weight:900;font-size:clamp(24px,6.6vw,32px);line-height:1.02;text-transform:uppercase;text-wrap:balance}
.marquee{position:relative;padding:9px;border-radius:16px;background:var(--gold-deep);isolation:isolate}
.marquee::before{content:"";position:absolute;inset:3px;border-radius:13px;z-index:-1;background-image:radial-gradient(circle, var(--cream) 0 1.6px, var(--gold) 2.4px, transparent 3.6px);background-size:14px 14px;animation:chase .7s steps(2) infinite}
@keyframes chase{to{background-position:7px 0}}
.board{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(3,1fr);gap:7px;padding:7px;border-radius:10px;background:var(--ink)}
.tile{position:relative;height:54px;perspective:600px}
.tile .in{position:absolute;inset:0;transition:transform .6s var(--ease-out);transform-style:preserve-3d}
.tile.open .in{transform:rotateX(180deg)}
.tile .f,.tile .bk{position:absolute;inset:0;display:flex;align-items:center;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.tile .f{justify-content:center;background:linear-gradient(180deg, var(--tile-hi), var(--tile));box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--cream) 35%, transparent)}
.tile .f b{display:grid;place-items:center;width:40px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:16px;box-shadow:inset 0 0 0 2px var(--gold)}
.tile .bk{transform:rotateX(180deg);background:var(--cream);color:var(--ink);justify-content:space-between;padding-left:9px}
.tile .bk span{font-family:var(--tall);font-weight:900;font-size:15px;line-height:1;text-transform:uppercase;padding-right:4px}
.tile .bk em{align-self:stretch;display:grid;place-items:center;min-width:38px;background:var(--navy);color:var(--cream);font-style:normal;font-family:var(--display);font-size:17px}
.tile.missed .bk{background:var(--stone-2);opacity:.85}
.tile.missed .bk em{background:var(--stone-3);color:var(--ink)}
.tile .flash{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle, var(--cream) 0%, color-mix(in srgb, var(--gold) 70%, transparent) 35%, transparent 70%);animation:flare .8s ease-out forwards;pointer-events:none;z-index:3}
@keyframes flare{from{opacity:1;transform:scale(.2)}to{opacity:0;transform:scale(1.4)}}
.sbar{display:flex;align-items:center;gap:10px}
.strikes{display:flex;gap:6px}
.strikes i{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--red-deep);font-style:normal;font-family:var(--display);font-size:20px;color:transparent;transition:all .25s var(--ease-pop)}
.strikes i.on{background:var(--red);color:var(--paper);box-shadow:0 0 16px var(--red);transform:scale(1.1)}
.timer{flex:1;height:10px;border-radius:5px;background:var(--night-3);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;border-radius:5px}
.timer.warn i{background:var(--red)}
.tleft{font-family:var(--display);font-size:18px;min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.sfound{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-align:right}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;height:58px;border:0;border-radius:14px;padding:0 14px;background:var(--cream);color:var(--ink);font-family:var(--tall);font-weight:800;font-size:22px;text-transform:uppercase;box-sizing:border-box}
.guess .btn{width:auto;flex:0 0 auto;min-height:58px;font-size:17px;padding:0 16px}
.bigx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none}
.bigx svg{width:min(52vw,240px);animation:xin .5s var(--ease-pop) forwards}
@keyframes xin{0%{transform:scale(2.6) rotate(-20deg);opacity:0}30%{opacity:1}80%{transform:scale(1) rotate(0);opacity:1}100%{opacity:0;transform:scale(.9)}}
.redflash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(ellipse at center, transparent 30%, color-mix(in srgb, var(--red) 55%, transparent) 100%);animation:fadeout .7s ease-out forwards}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.toast{position:fixed;left:50%;top:22%;z-index:60;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--display);font-size:16px;letter-spacing:.03em;box-shadow:0 6px 0 var(--gold-deep);animation:toast 1.3s var(--ease-out) forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* PIN round */
.photo{position:relative;border-radius:12px;overflow:hidden;background:var(--ink);aspect-ratio:16/10;max-width:100%;box-shadow:0 0 0 2px color-mix(in srgb, var(--mint) 35%, transparent)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .zoom{position:absolute;right:8px;bottom:8px;padding:4px 8px;border-radius:6px;background:color-mix(in srgb, var(--ink) 75%, transparent);font-size:10px;font-weight:700;letter-spacing:.12em}
.mapwrap{position:relative;height:min(46vh,380px);min-height:240px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px color-mix(in srgb, var(--mint) 35%, transparent);transition:height .5s var(--ease-out)}
.mapwrap.big{height:min(60vh,480px)}
#map{position:absolute;inset:0;background:var(--stone)}
.maphint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:500;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--stone);font-size:11px;font-weight:700;letter-spacing:.12em;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.maphint.gone{opacity:0}
.mapbtns{position:absolute;right:8px;bottom:22px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--stone);font-family:var(--display);font-size:22px}
.yearbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--lake);box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--mint) 30%, transparent)}
.nix{display:flex;justify-content:center;gap:5px}
.nix i{display:grid;place-items:center;width:44px;height:56px;border-radius:9px;background:var(--ink);font-style:normal;font-family:var(--tall);font-weight:800;font-size:46px;color:var(--amber);text-shadow:0 0 10px var(--amber), 0 0 22px var(--pin)}
.yearbox input[type=range]{accent-color:var(--amber)}
.ylab{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted)}
.leaflet-container{font-family:var(--mono);background:var(--stone)}
.leaflet-control-attribution{font-size:9px!important;background:color-mix(in srgb, var(--stone) 85%, transparent)!important;color:var(--ink)!important}
.leaflet-control-attribution a{color:var(--ink)!important}
.m-water{fill:var(--water);fill-opacity:1;stroke:none}
.m-park{fill:var(--park);fill-opacity:1;stroke:none}
.m-bldg{fill:var(--stone-2);fill-opacity:1;stroke:var(--stone-3);stroke-width:.6}
.m-campus{fill:color-mix(in srgb, var(--stone-2) 70%, var(--amber));fill-opacity:.35;stroke:none}
.m-case{stroke:var(--stone-3);fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-road{stroke:var(--road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-path{stroke:var(--stone-3);fill:none;stroke-dasharray:2 4;stroke-linecap:round}
.m-rail{stroke:var(--ink);fill:none;stroke-opacity:.35;stroke-dasharray:6 4}
.m-line{stroke:var(--ink);stroke-width:3;stroke-dasharray:8 8;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.map-label{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.08em;color:var(--ink);white-space:nowrap;text-transform:uppercase;text-shadow:0 0 3px var(--stone),0 0 3px var(--stone)}
.map-label.area{font-family:var(--tall);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--stone-3)}
.map-label.water{font-family:var(--tall);font-weight:700;font-size:16px;letter-spacing:.2em;color:color-mix(in srgb, var(--stone) 80%, var(--water));text-shadow:none;font-style:italic}
.pin-ico{width:36px;height:46px;animation:pindrop .45s var(--ease-pop)}
@keyframes pindrop{from{transform:translateY(-40px);opacity:0}}
.flag-ico{width:40px;height:48px;animation:flagup .6s var(--ease-pop)}
@keyframes flagup{from{transform:scale(0) translateY(20px)}}
.dist-chip{width:max-content;background:var(--ink);color:var(--amber);font-family:var(--tall);font-weight:800;font-size:18px;padding:3px 9px;border-radius:7px;white-space:nowrap}
.yearflag{position:absolute;left:10px;top:10px;z-index:600;padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--stone);box-shadow:0 4px 0 var(--pin);animation:screenin .4s var(--ease-pop)}
.yearflag small{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mint)}
.yearflag b{font-family:var(--tall);font-weight:900;font-size:40px;line-height:1;color:var(--amber)}
.pincard{padding:12px 14px;border-radius:14px;background:var(--stone);color:var(--ink)}
.pincard h3{margin:0;font-family:var(--tall);font-weight:900;font-size:24px;text-transform:uppercase;line-height:1}
.pincard p{margin:6px 0 0;font-size:12.5px;line-height:1.45}
.credit{margin:0;font-size:10px;color:var(--muted)} .credit a{color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:2000;background:color-mix(in srgb, var(--ink) 94%, transparent);display:grid;place-items:center}
.lightbox img{max-width:100vw;max-height:88vh;object-fit:contain}

/* RESULTS */

}

/* ================= THE PRIZE: two wheels ================= */
function wheelSVG(slices, id){
  const n = slices.length, R0 = 200, cx = 200, cy = 200, a = 360 / n;
  const pt = (deg, r) => { const t = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const parts = slices.map((s, k) => {
    const a0 = k * a, a1 = (k + 1) * a, [x0, y0] = pt(a0, R0), [x1, y1] = pt(a1, R0), mid = a0 + a / 2;
    const [tx, ty] = pt(mid, R0 * .62);
    const fs = s.label.length > 12 ? 13 : s.label.length > 9 ? 15 : 17;
    return `<path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R0} ${R0} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${s.col}" stroke="var(--night)" stroke-width="3"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${(mid > 180 ? mid + 90 : mid - 90).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="middle" font-family="Bowlby One, Impact, sans-serif" font-size="${fs}" fill="${s.ink || '#FFFFFF'}" style="letter-spacing:.02em">${esc(s.label)}</text>`;
  }).join('');
  const bulbs = Array.from({ length:n * 2 }, (_, k) => { const [bx, by] = pt(k * a / 2, R0 + 9); return `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4" fill="${k % 2 ? 'var(--cream)' : 'var(--gold)'}"/>`; }).join('');
  return `<svg class="wheel" viewBox="-20 -20 440 440" aria-hidden="true"><circle cx="200" cy="200" r="214" fill="var(--gold-deep)"/>${bulbs}<g id="${id}">${parts}</g></svg>`;
}
const POINTER = '<svg class="pointer" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 42L3 8a14 14 0 0 1 28 0z" fill="var(--red)" stroke="var(--cream)" stroke-width="3"/><circle cx="17" cy="12" r="5" fill="var(--cream)"/></svg>';
function spin(gEl, n, target, ms){
  // land the middle of slice `target` under the pointer, after several turns
  const a = 360 / n, jitter = (Math.random() - .5) * a * .6;
  const end = 360 * (5 + Math.floor(Math.random() * 2)) + (360 - (target * a + a / 2)) + jitter;
  const t0 = performance.now(); let lastSlice = -1;
  const ease = p => 1 - Math.pow(1 - p, 4);
  return new Promise(res => { (function f(now){
    const p = Math.min(1, (now - t0) / ms), rot = end * ease(p);
    gEl.setAttribute('transform', `rotate(${rot.toFixed(2)} 200 200)`);
    const sl = Math.floor(((rot % 360) + 360) % 360 / a); if (sl !== lastSlice) { lastSlice = sl; SFX.click(); if (p > .6) vibe(4); }
    if (p < 1) requestAnimationFrame(f); else res();
  })(t0); });
}
const pickW = arr => { const tot = arr.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot; for (let i = 0; i < arr.length; i++) { r -= arr[i].w; if (r <= 0) return i; } return arr.length - 1; };
function confetti(){
  if (reduced) return; const cols = ['var(--gold)', 'var(--mint)', 'var(--red)', 'var(--hi)', 'var(--blue)', 'var(--cream)'];
  for (let i = 0; i < 90; i++) { const p = document.createElement('i'); p.className = 'confetti'; p.style.left = Math.random() * 100 + 'vw'; p.style.top = '-20px'; p.style.background = cols[i % cols.length]; document.body.appendChild(p);
    p.animate([{ transform:'translate(0,0) rotate(0)' }, { transform:`translate(${(Math.random() - .5) * 200}px, ${innerHeight + 60}px) rotate(${Math.random() * 900}deg)` }], { duration:1600 + Math.random() * 1600, easing:'cubic-bezier(.2,.6,.4,1)', delay:Math.random() * 400 }).onfinish = () => p.remove(); }
}
