<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Game | Off Campus</title>
<meta name="description" content="Your club's own game. Members play, you get real answers.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* ---------- tokens (same as the Queen's Daily) ---------- */
:root{--night:#07060F;--night-2:#120F24;--night-3:#1C1836;--text:#F6F1E8;--muted:#A49FC0;--gold:#FFC83D;--gold-deep:#B97F05;--red:#FF3B4A;--mint:#7FE0C4;--blue:#2D4BFF;--paper:#F6F3EA;--ink:#111111;--cream:#FFF5DE;--good:#3BD67A;--pin:#FF5A1F;--tile:#2246E6;--tile-hi:#4F72FF;--navy:#0A1036;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;--tall:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--mono:"IBM Plex Mono",Menlo,Consolas,monospace;--ease-out:cubic-bezier(.16,1,.3,1);--ease-pop:cubic-bezier(.2,1.45,.4,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--text);font:600 14px/1.4 var(--mono);-webkit-tap-highlight-color:transparent}
body{min-height:100svh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 30% at 85% 0%, color-mix(in srgb, var(--gold) 26%, transparent), transparent 70%),radial-gradient(45% 35% at 0% 100%, color-mix(in srgb, var(--tile) 35%, transparent), transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit}
#app{max-width:560px;margin:0 auto;padding:max(14px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.screen{display:flex;flex-direction:column;gap:12px;animation:in .4s var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:var(--display);font-size:17px;letter-spacing:.01em}.logo span{color:var(--gold)}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.kick{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--mint)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,54px);line-height:.92}
h1 span{color:var(--gold)}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
p.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:0 18px;border-radius:16px;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:19px;letter-spacing:.01em;box-shadow:0 6px 0 var(--gold-deep);text-decoration:none;text-align:center;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gold-deep)}
.btn.go{background:var(--good);box-shadow:0 6px 0 #1E8A4A}
.btn.ghost{background:var(--night-2);color:var(--text);box-shadow:inset 0 0 0 2px var(--night-3);font-size:15px;min-height:50px}
.btn[disabled]{opacity:.45;pointer-events:none}
.dock{position:fixed;left:16px;right:16px;bottom:max(14px, env(safe-area-inset-bottom));width:auto!important;max-width:528px;margin:0 auto;z-index:20}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.field input,.field textarea{width:100%;height:50px;border:0;border-radius:12px;padding:0 14px;background:var(--cream);color:var(--ink);font-weight:700;font-size:16px}
.field small{font-size:11px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{min-height:40px;padding:0 12px;border-radius:999px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--night-3);font-size:12px;font-weight:700}
.types button.on{background:var(--mint);color:var(--ink);box-shadow:none}
.panel{padding:14px;border-radius:18px;background:var(--night-2);display:flex;flex-direction:column;gap:10px}
details.panel summary{cursor:pointer;list-style:none;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mint)}
details.panel summary::-webkit-details-marker{display:none}
/* builder: pick cards */
.group h3{margin:6px 0 6px;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--night-3);margin-bottom:7px;transition:box-shadow .2s, background .2s}
.opt.on{box-shadow:inset 0 0 0 2px var(--good);background:color-mix(in srgb, var(--good) 10%, var(--night-2))}
.opt .tick{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--night);font-family:var(--display);color:var(--ink)}
.opt.on .tick{background:var(--good)}
.opt textarea{flex:1;width:100%;min-height:24px;overflow:hidden;border:0;background:transparent;color:var(--text);font-weight:700;font-size:14px;line-height:1.35;resize:none;padding:4px 0}
.opt .opts{font-size:11px;color:var(--muted);margin-top:2px}
.count{position:sticky;top:0;z-index:5;padding:8px 0;background:linear-gradient(var(--night) 70%, transparent);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--mint)}
/* game */
.hud{display:flex;justify-content:space-between;align-items:center}
.hud b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold)}
.dots{display:flex;gap:5px}.dots i{width:22px;height:6px;border-radius:3px;background:var(--night-3)}.dots i.on{background:var(--mint)}.dots i.now{background:var(--gold)}
.card{padding:18px;border-radius:20px;background:var(--paper);color:var(--ink);box-shadow:0 8px 0 color-mix(in srgb, var(--paper) 30%, var(--night))}
.card small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;color:#7a6f5c}
.card .q{margin:8px 0 0;font-family:var(--tall);font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1;text-transform:uppercase;text-wrap:balance}
.card.small .q{font-size:clamp(20px,5.8vw,26px)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button,.pick button{min-height:66px;border-radius:16px;font-family:var(--display);font-size:24px;color:var(--ink)}
.yn .y{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep)}.yn .n{background:var(--paper);box-shadow:0 6px 0 #b5aa92}
.pick{display:grid;gap:9px}
.pick button{min-height:56px;font-size:18px;background:var(--paper);box-shadow:0 5px 0 #b5aa92;padding:8px 14px;line-height:1.1}
.pick button.sel{background:var(--gold);box-shadow:0 5px 0 var(--gold-deep)}
.pick.two{grid-template-columns:1fr 1fr}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.said{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--mint)}
.pct{display:flex;align-items:center;gap:12px}
.pct button{flex:0 0 52px;height:52px;border-radius:14px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--night-3);font-family:var(--display);font-size:24px}
.pct b{flex:1;text-align:center;font-family:var(--display);font-weight:400;font-size:52px;color:var(--gold);line-height:1}
input[type=range]{width:100%;accent-color:var(--gold);height:40px}
.namein{display:flex;gap:8px}.namein input{flex:1;height:54px;border:0;border-radius:14px;padding:0 14px;background:var(--cream);color:var(--ink);font-weight:700;font-size:16px}
.namein button{flex:0 0 auto;padding:0 16px;border-radius:14px;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}.chips span{padding:7px 11px;border-radius:999px;background:var(--night-2);box-shadow:inset 0 0 0 2px var(--mint);font-size:12.5px;font-weight:700}
.reveal{display:flex;flex-direction:column;gap:10px;animation:in .45s var(--ease-pop)}
.bar{position:relative;height:50px;border-radius:12px;background:var(--night-2);overflow:hidden;box-shadow:inset 0 0 0 2px var(--paper)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width 1.1s var(--ease-out)}
.bar span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:22px;color:var(--ink);mix-blend-mode:normal}
.bar.low span{color:var(--text)}
.bar em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.split div{padding:10px 12px;border-radius:12px;background:var(--night-2)}.split div.win{box-shadow:inset 0 0 0 2px var(--gold)}
.split b{display:block;font-family:var(--display);font-weight:400;font-size:28px}.split span{font-size:12px;font-weight:700}
.pts{align-self:center;font-family:var(--display);font-size:40px;color:var(--gold)}.pts small{font-family:var(--mono);font-size:14px;color:var(--muted)}
.note{padding:10px 12px;border-radius:12px;background:var(--night-2);font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.note b{color:var(--text)}
.tops{display:flex;flex-direction:column;gap:5px}.tops div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--night-2);font-weight:700}.tops div.hit{box-shadow:inset 0 0 0 2px var(--good)}
.verdict{align-self:center;padding:6px 14px;background:var(--red);color:var(--paper);font-family:var(--display);font-size:20px;transform:rotate(-3deg);box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--red)}
.verdict.good{background:var(--good);color:var(--ink);box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--good)}
.execbar{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--red);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:.1em;text-align:left}
.execbar b{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:0;white-space:nowrap}
.lockbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.stamp{display:inline-block;padding:6px 14px;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:18px;transform:rotate(-3deg);box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--gold)}
.stamp.go{background:var(--good);box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--good)}
.what{margin:0;padding:12px 14px 12px 32px;border-radius:14px;background:var(--night-2);display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700}
.what li::marker{color:var(--gold)}
.btn.red{background:var(--red);color:var(--paper);box-shadow:0 6px 0 color-mix(in srgb, var(--red) 55%, black)}
.btn.red.armed{animation:pulse .7s var(--ease-out) infinite alternate}
@keyframes pulse{to{transform:scale(1.025)}}
.btn.wide{width:100%}
button.said{align-self:flex-start;padding:0;text-align:left}
em.you{font-style:normal;margin-left:6px;padding:2px 6px;border-radius:6px;background:var(--gold);color:var(--ink);font-size:10px;letter-spacing:.08em}
.tops div b{white-space:nowrap}
/* finish */
.score{padding:16px;border-radius:20px;background:var(--night-2);box-shadow:0 0 0 3px var(--gold);text-align:center}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(50px,15vw,74px);line-height:.95;color:var(--gold)}
.score span{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.score .rank{display:inline-block;margin-top:8px;padding:5px 12px;background:var(--red);color:var(--paper);font-family:var(--display);font-size:16px;transform:rotate(-2deg)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.board li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--night-2);font-weight:700}
.board li.me{box-shadow:inset 0 0 0 2px var(--gold)}
.board li .r{flex:0 0 20px;font-family:var(--display);color:var(--gold)}.board li .n{flex:1}.board li .s{font-family:var(--display)}
.oc{padding:12px 14px;border-radius:16px;background:color-mix(in srgb, var(--mint) 12%, var(--night-2));box-shadow:inset 0 0 0 2px var(--mint);display:flex;flex-direction:column;gap:5px}
.oc b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--mint)}
.oc span{font-size:12px;font-weight:700;color:var(--text)}
.oc span::before{content:"→ ";color:var(--mint)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links .btn{min-height:46px;font-size:13px}
.res{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:var(--night-2)}
.res .rq{font-weight:700;font-size:13px;line-height:1.35}
.linkbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:700;font-size:13px;word-break:break-all}
.toast{position:fixed;left:50%;top:18%;z-index:60;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--cream);color:var(--ink);font-family:var(--display);font-size:15px;white-space:nowrap;animation:toast 1.6s var(--ease-out) forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.foot{font-size:11px;color:var(--muted);text-align:center}.foot a{color:var(--mint)}
@media (max-height:700px){.card{padding:14px}.card .q{font-size:clamp(24px,7.4vw,32px)}.screen{gap:10px}.yn button{min-height:58px}.pts{font-size:34px}.pct b{font-size:44px}}
@media (max-height:660px){.introchips{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ================= settings you can change ================= */
const MAX_PICKS = 5;
const RELEASE_MIN = 5;           // must match RELEASE_MIN on the server (lib/clubs.mjs)

const API = (() => { const t = new URLSearchParams(location.search).get('api'); if (t && /^http:\/\/localhost:\d+$/.test(t)) return t; return /(^|\.)offcampusontario\.ca$|\.netlify\.app$/.test(location.hostname) ? '' : null; })();
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const fmt = n => Number(n || 0).toLocaleString('en-CA');
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const vibe = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1700); };
const track = n => { try { window.goatcounter && window.goatcounter.count({ path:'event-' + n, event:true }); } catch (e) {} };
const randId = () => Array.from(crypto.getRandomValues(new Uint8Array(20)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const PLAYER_ID = (() => { let id = store.get('oc-pid'); if (!id || !/^[a-z0-9]{12,40}$/.test(id)) { id = randId(); store.set('oc-pid', id); } return id; })();
const nick = () => store.get('oc-nick') || '';
async function api(method, p, body){
  if (API === null) throw new Error('offline');
  const r = await fetch(API + p, { method, headers: body ? { 'Content-Type':'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'error'); return j;
}
async function shareText(text, url){
  try { if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('COPIED, PASTE IT IN THE CHAT'); } catch (e) { toast(url); }
}
const SITE = 'https://offcampusontario.ca';
const clubUrl = slug => `${SITE}/club/${slug}`;
const head = right => `<div class="top"><a class="logo" href="/" style="color:inherit;text-decoration:none">OFF <span>CAMPUS</span></a><span class="chip">${right || 'CLUB GAMES'}</span></div>`;

/* ================= QUESTION BANK =================
   {club} = club name · {thing} = what you do together · {spot} = where you end up after · {lore} = something every member has done
   {debateA} / {debateB} = the debate the club never settles. Each club type has its own questions, then the general ones fill in.
   yn  = yes/no: members answer, then guess what % of the club said yes
   pop = most popular: members pick one, then guess the club's top pick */
const TYPES = [
  ['sports', 'Sports & fitness', 'practice'], ['outdoors', 'Outdoors & trips', 'trips'], ['gaming', 'Gaming', 'game nights'],
  ['performing', 'Dance & performing', 'rehearsal'], ['cultural', 'Cultural', 'events'], ['business', 'Business & pro', 'events'],
  ['faculty', 'Faculty society', 'study sessions'], ['social', 'Social & other', 'socials'] ];
const BANK = {
  yn: {
    sports:['Have you ever pretended to be injured to skip {thing}?', 'Have you ever posted a workout just for the likes?', 'Have you ever been way more competitive than the game needed?'],
    outdoors:['Have you ever packed way too much for a trip?', 'Have you ever been the reason a trip ran late?', 'Would you survive a night outside with no gear?'],
    gaming:['Have you ever blamed lag for your own mistake?', 'Have you ever said "one more game" and played two more hours?', 'Have you ever gamed all night before an exam?'],
    performing:['Have you ever forgotten the choreo mid-show and just vibed?', 'Have you ever practised in a Stauffer bathroom?', 'Have you ever cried after a performance?'],
    cultural:['Have you ever stayed for the food more than the event?', 'Have you ever made a best friend at your first event?', 'Have you ever called your parents mid-event to settle a debate?'],
    business:['Have you ever networked at a party?', 'Have you ever put your club role on LinkedIn before doing anything?', 'Have you ever worn a quarter-zip to a social?'],
    faculty:['Have you ever skipped the lecture but gone to the social?', 'Do you think your faculty has it hardest at Queen\'s?', 'Have you ever studied with {club} the night before and still panicked?'],
    social:['Have you ever been the last one to leave a {club} social?', 'Have you ever made up a reason to leave early?', 'Have you ever slept through a {club} event?'],
    all:['Have you ever {lore}?', 'Have you ever ended up at {spot} after {thing}?', 'Have you ever joined {club} mostly for the socials?', 'Do you think {club} is the best club at Queen\'s?',
      'Have you ever skipped {thing} and lied about why?', 'Have you ever had a crush on someone in {club}?', 'Have you ever brought a date to a {club} event?', 'Have you ever muted the {club} group chat?'] },
  pop: {
    sports:[['Right after {thing}, what\'s your first move?', ['Water', 'Food', 'Stretch', 'Lie down forever']], ['Best excuse for missing {thing}?', ['Too cold', 'Midterm', '"Injured"', 'Overslept']]],
    outdoors:[['First thing someone forgets on a trip?', ['Charger', 'Rain jacket', 'Snacks', 'Socks']], ['Best part of a trip?', ['The view', 'The food', 'The drive', 'The campfire']]],
    gaming:[['Classic excuse after a bad game?', ['Lag', 'Teammates', 'Matchmaking', '"Wasn\'t trying"']], ['Best game night snack?', ['Chips', 'Pizza', 'Energy drink', 'Candy']]],
    performing:[['What goes wrong at every show?', ['A costume', 'The music', 'Someone blanks', 'The lights']], ['Best part of show night?', ['The bows', 'Backstage', 'The afterparty', 'The pics']]],
    cultural:[['Best part of a {club} event?', ['The food', 'The music', 'The people', 'The pics']], ['What do you leave a {club} event with?', ['Leftovers', 'A new friend', 'A story', 'A food coma']]],
    business:[['Word you\'ll hear at every {club} event?', ['Networking', 'Synergy', 'LinkedIn', 'Coffee chat']], ['Dream job after Queen\'s?', ['Bay Street', 'My own company', 'Big tech', 'No idea']]],
    faculty:[['Where does {club} actually study?', ['Stauffer', 'Douglas', 'Someone\'s house', 'We don\'t']], ['Worst part of exam season?', ['No sleep', 'The library', 'Group projects', 'The caffeine']]],
    social:[['What always happens at a {club} social?', ['Someone leaves early', 'Aux fight', 'Food runs out', 'Someone falls asleep']], ['Best night for a {club} social?', ['Thursday', 'Friday', 'Saturday', 'Any night']]],
    all:[['Where does {club} end up after {thing}?', ['{spot}', 'Someone\'s house', 'Osmow\'s', 'Straight to bed']], ['{club}\'s never-ending debate:', ['{debateA}', '{debateB}']],
      ['Best part of {club}?', ['The people', 'The socials', 'The {thing}', 'The group chat']], ['How do you read the {club} group chat?', ['Instantly', 'Same day', 'Only when tagged', 'Muted']],
      ['Best spot for a night out?', ['Stages', 'Ale House', 'Trin', 'A house party']]] } };

function fill(t, f){
  return t.replace(/\{club\}/g, f.club).replace(/\{thing\}/g, f.thing).replace(/\{spot\}/g, f.spot).replace(/\{lore\}/g, f.lore.replace(/^(have|has)\s+/i, '').replace(/[.?!]+$/, ''))
    .replace(/\{debateA\}/g, f.debateA).replace(/\{debateB\}/g, f.debateB);
}
function options(f){
  const text = t => Array.isArray(t) ? t[0] + ' ' + t[1].join(' ') : t;
  const need = t => { const s = text(t); return (!/\{spot\}/.test(s) || f.spot) && (!/\{lore\}/.test(s) || f.lore) && (!/\{debate/.test(s) || (f.debateA && f.debateB)); };
  const mine = t => /\{(lore|spot|debate)/.test(text(t));
  const pickTexts = kind => { const all = [...(BANK[kind][f.type] || []), ...BANK[kind].all].filter(need); return [...all.filter(mine), ...all.filter(t => !mine(t))]; };
  const out = [];
  if (f.trivia && f.trivia.q && f.trivia.right && f.trivia.wrong.filter(Boolean).length) {
    const opts = [f.trivia.right, ...f.trivia.wrong.filter(Boolean)]; const order = opts.map(o => [o, Math.random()]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    out.push({ kind:'trivia', q:f.trivia.q, opts:order, right:order.indexOf(f.trivia.right) });
  }
  pickTexts('yn').slice(0, 7).forEach(t => out.push({ kind:'yn', q:fill(t, f) }));

    const seen = new Set(), opts = o.map(x => fill(x, f)).filter(x => { const k = x.toLowerCase(); if (!x || seen.has(k)) return false; seen.add(k); return true; });
    if (opts.length >= 2) out.push({ kind:'pop', q:fill(q, f), opts });
  });
  // starting picks: trivia if they wrote one, 3 yes/no, 1 most popular (a 4th yes/no if there's no trivia)
  const want = { trivia:1, yn:out.some(o => o.kind === 'trivia') ? 3 : 4, pop:1 }, got = {};
  out.forEach(o => { got[o.kind] = got[o.kind] || 0; if (got[o.kind] < want[o.kind]) { o.on = true; got[o.kind]++; } });

}

  window.scrollTo(0, 0);
  app.innerHTML = `<section class="screen">${head(NAME())}${execBar()}
    <div class="lockbox"><span class="stamp">PREDICTIONS LOCKED</span><h1>${NAME()}'S RESULTS <span>DROP SOON</span></h1>
      <p class="sub">When your exec releases them, come back to this link for your score, your rank and how everyone really answered.</p>
      <div class="note"><b>${G.played}</b> ${G.played === 1 ? 'has' : 'have'} played${S && S.trivia !== null && just ? ` · trivia: <b>${S.trivia ? 'you got it ✓' : 'missed it'}</b>` : ''}</div></div>
    ${dailyCard()}
    <div class="links"><button class="btn ghost" id="share">SEND THE GAME</button>${crewBtn()}</div>
    <button class="btn go dock" id="daily">PLAY TODAY'S QUEEN'S 5</button></section>`;
  wireExecBar(); wireCommon(`How well do you know ${G.name}? 2 minutes, results drop soon:`);
}
const dailyCard = () => `<div class="oc"><b>THERE'S A NEW QUEEN'S GAME EVERY DAY</b><span>5 questions · 2 minutes · the same for all of Queen's</span></div>`;
const crewKey = () => 'oc-clubcrew-' + G.slug;
const crewBtn = () => !G.crew ? '' : store.get(crewKey()) ? `<button class="btn ghost" disabled>IN THE CREW ✓</button>` : `<button class="btn ghost" id="crew">JOIN ${NAME()}'S DAILY CREW</button>`;
function wireCommon(shareMsg){
  const sh = $('#share'); if (sh) sh.onclick = () => { track('club-share'); shareText(shareMsg, clubUrl(G.slug)); };
  const cr = $('#crew'); if (cr) cr.onclick = async () => { cr.disabled = true;
    try { await api('POST', `/api/crews/${G.crew}/join`, { playerId:PLAYER_ID, nick:nick() }); store.set(crewKey(), true); track('club-crew-join'); cr.textContent = 'IN THE CREW ✓'; toast('YOU\'RE IN THE CREW'); vibe([20, 30]); }
    catch (e) { cr.disabled = false; toast('COULDN\'T JOIN, TRY AGAIN'); } };
  const d = $('#daily'); if (d) d.onclick = () => { track('club-to-daily'); location.href = `/daily.html?ref=club${API ? '&api=' + encodeURIComponent(API) : ''}`; };
}

/* ---------- after the results are out ---------- */
async function getResults(){
  const k = execKey();
  try { return await api('GET', `/api/clubs/${G.slug}/results?playerId=${PLAYER_ID}${k ? '&k=' + encodeURIComponent(k) : ''}`); } catch (e) { return null; }
}
const boardRows = rows => `<ol class="board">${rows.map(r => `<li class="${r.you ? 'me' : ''}"><span class="r">${r.rank}</span><span class="n">${esc(r.nick)}</span><span class="s">${fmt(r.score)}</span></li>`).join('')}</ol>`;
async function scorePage(just){
  window.scrollTo(0, 0);
  const R = await getResults(); if (!R || !R.released) return locked(just);
  const me = R.me;
  app.innerHTML = `<section class="screen">${head(NAME())}${execBar()}
    <div class="score"><span>YOUR SCORE</span><b>${me ? fmt(me.score) : '–'}</b><span>OUT OF ${fmt(G.cards.length * 1000)}</span>${me ? `<br><span class="rank">#${me.rank} OF ${R.ranked} IN ${NAME()}</span>` : ''}</div>
    ${R.board.length ? boardRows(R.board.slice(0, 3).concat(me && me.rank > 3 ? [{ ...me, nick:nick() || 'You', you:true }] : [])) : ''}
    <div class="links"><button class="btn ghost" id="seeres">HOW THE CLUB ANSWERED</button><button class="btn ghost" id="share">CHALLENGE THE CLUB</button></div>
    ${crewBtn().replace('btn ghost', 'btn ghost wide')}
    <button class="btn go dock" id="daily">PLAY TODAY'S QUEEN'S 5</button></section>`;
  wireExecBar(); wireCommon(me ? `I got ${fmt(me.score)} on the ${G.name} game (#${me.rank}). Beat me:` : `How well do you know ${G.name}?`);
  $('#seeres').onclick = () => report(R);
}
async function report(R){
  window.scrollTo(0, 0);
  R = R || await getResults(); if (!R || !R.released) return G.exec ? execPage() : locked();
  const rows = G.cards.map((c, i) => { const t = R.cards[i] || { n:0 };
    let body = `<span class="sub">Nobody answered this one.</span>`;
    if (t.n && c.kind === 'yn') { const pct = Math.round(100 * t.yes / t.n); body = `<div class="bar${pct < 35 ? ' low' : ''}"><i style="width:${pct}%"></i><span>${pct}% YES</span><em>${t.yes} OF ${t.n}</em></div>`; }
    if (t.n && c.kind === 'pop') body = popRows(c, t, -1);
    if (t.n && c.kind === 'trivia') { const pct = Math.round(100 * t.right / t.n); body = `<div class="bar${pct < 35 ? ' low' : ''}"><i style="width:${pct}%"></i><span>${pct}% GOT IT</span><em>${t.right} OF ${t.n}</em></div><span class="sub">Answer: <b style="color:var(--text)">${esc(c.opts[R.trivia[i]])}</b></span>`; }
    return `<div class="res"><span class="rq">${i + 1}. ${esc(c.q)}</span>${body}</div>`; }).join('');
  app.innerHTML = `<section class="screen">${head(R.exec ? 'EXEC' : 'RESULTS')}
    <div class="kick">WE ASKED ${R.players} ${NAME()} MEMBERS</div><h1>THE CLUB <span>HAS SPOKEN</span></h1>
    ${rows}
    ${R.board.length ? `<div class="lbl">LEADERBOARD</div>${boardRows(R.board.slice(0, 10))}` : ''}
    <div class="links"><button class="btn ghost" id="post">MAKE AN INSTAGRAM POST</button><button class="btn ghost" id="share">SEND IT TO THE CHAT</button></div>
    ${R.exec ? `<button class="btn dock" id="sendres">SEND THE RESULTS TO THE CHAT</button>` : (G.me && G.me.done ? `<button class="btn go dock" id="daily">PLAY TODAY'S QUEEN'S 5</button>` : `<a class="btn dock" href="${pageUrl(G.slug)}">PLAY IT NOW</a>`)}
    <p class="foot">Real answers from ${esc(G.name)} members who played · Made with Off Campus · <a href="/clubs">get a game for your club</a></p></section>`;
  $('#post').onclick = () => postImage(R);
  wireCommon(resultsMsg(G.name));
  const sr = $('#sendres'); if (sr) sr.onclick = () => { track('club-send-results'); shareText(resultsMsg(G.name), clubUrl(G.slug)); };
}

/* ---------- the exec's page: release the results ---------- */
async function execPage(){
  window.scrollTo(0, 0);
  if (!G.exec) return intro();
  const R = await getResults(); if (!R) { toast('NO CONNECTION'); return; }
  if (R.released) return report(R);
  G.played = R.played;
  const ready = R.played >= R.releaseMin;
  app.innerHTML = `<section class="screen">${head('EXEC')}
    <div class="kick">${NAME()} · YOUR CLUB GAME</div>
    <div class="score"><span>MEMBERS WHO HAVE PLAYED</span><b>${R.played}</b>${ready ? '' : `<span>${R.releaseMin - R.played} MORE TO GO BEFORE YOU CAN RELEASE</span>`}</div>
    <ul class="what"><li>Answers lock for good</li><li>Everyone's score and the club leaderboard go live</li><li>You get a message to send and a post for your Instagram</li><li>Anyone who hasn't played can still play and get a score</li></ul>
    <div class="links"><button class="btn ghost" id="share">SEND THE GAME AGAIN</button><a class="btn ghost" href="${pageUrl(G.slug)}">${G.me && G.me.done ? 'MY GAME' : 'PLAY IT YOURSELF'}</a></div>
    <button class="btn red dock" id="release" ${ready ? '' : 'disabled'}>${ready ? 'RELEASE THE RESULTS' : `RELEASE AT ${R.releaseMin} PLAYERS`}</button></section>`;
  wireCommon(gameMsg(G.name));
  const rb = $('#release'); let armed = false, timer;
  rb.onclick = async () => {
    if (!armed) { armed = true; vibe(15); rb.textContent = 'TAP AGAIN TO RELEASE'; rb.classList.add('armed'); timer = setTimeout(() => { armed = false; rb.textContent = 'RELEASE THE RESULTS'; rb.classList.remove('armed'); }, 3500); return; }
    clearTimeout(timer); rb.disabled = true; rb.textContent = 'RELEASING…';
    try { await api('POST', `/api/clubs/${G.slug}/release`, { k:execKey() }); track('club-release'); G.released = true; released(); }
    catch (e) { rb.disabled = false; armed = false; rb.textContent = 'RELEASE THE RESULTS'; toast(/not enough/.test(e.message) ? `NEEDS ${R.releaseMin} PLAYERS FIRST` : 'COULDN\'T RELEASE, TRY AGAIN'); }
  };
}
function released(){
  window.scrollTo(0, 0); vibe([30, 40, 60]);
  app.innerHTML = `<section class="screen">${head('EXEC')}
    <div class="lockbox"><span class="stamp go">RESULTS ARE OUT</span><h1>NOW TELL <span>${NAME()}</span></h1>
      <p class="sub">Everyone's score and the leaderboard are live on the same link. Send it so they come see, and anyone who hasn't played can still compete.</p></div>
    <div class="links"><button class="btn ghost" id="post">MAKE AN INSTAGRAM POST</button><button class="btn ghost" id="seeres">SEE THE RESULTS</button></div>
    <button class="btn dock" id="sendres">SEND THE RESULTS TO THE CHAT</button></section>`;
  $('#sendres').onclick = () => { track('club-send-results'); shareText(resultsMsg(G.name), clubUrl(G.slug)); };
  $('#seeres').onclick = () => report();
  $('#post').onclick = async () => { const R = await getResults(); if (R) postImage(R); };
}

/* ================= INSTAGRAM RESULTS POST (1080 x 1350) ================= */
async function postImage(R){
  track('club-post'); try { await document.fonts.ready; } catch (e) {}
  const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  x.fillStyle = css('--night'); x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W, 0, 0, W, 0, 900); g.addColorStop(0, 'rgba(255,200,61,.30)'); g.addColorStop(1, 'rgba(255,200,61,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.textAlign = 'left'; x.fillStyle = css('--mint'); x.font = '700 30px "IBM Plex Mono"'; x.fillText(`WE ASKED ${R.players} ${G.name.toUpperCase()} MEMBERS`.slice(0, 52), 80, 130);
  x.fillStyle = css('--text'); x.font = '110px "Bowlby One"'; x.fillText('THE CLUB', 80, 260); x.fillStyle = css('--gold'); x.fillText('HAS SPOKEN.', 80, 380);
  const wrap = (t, X, Y, maxW, lh) => { const words = String(t).split(' '); let line = '', y = Y; for (const w of words) { const test = line ? line + ' ' + w : w; if (x.measureText(test).width > maxW && line) { x.fillText(line, X, y); line = w; y += lh; } else line = test; } x.fillText(line, X, y); return y; };
  let y = 470, n = 0;
  const all = G.cards.map((c, i) => [c, i]), byKind = k => all.filter(x => x[0].kind === k), yn = byKind('yn');
  const order = [...yn.slice(0, 1), ...byKind('pop').slice(0, 1), ...yn.slice(1), ...byKind('pop').slice(1), ...byKind('trivia')];
  order.forEach(([c, i]) => { const t = R.cards[i]; if (!t || !t.n || n >= 3) return; let big = '', small = '', foot = '';
    if (c.kind === 'yn') { big = Math.round(100 * t.yes / t.n) + '%'; small = 'said yes: ' + c.q; foot = `${t.yes} of ${t.n}`; }
    else if (c.kind === 'pop') { const w = t.counts.indexOf(Math.max(...t.counts)); big = Math.round(100 * t.counts[w] / t.n) + '%'; small = `picked ${c.opts[w]}: ${c.q}`; foot = `${t.counts[w]} of ${t.n}`; }
    else { big = Math.round(100 * t.right / t.n) + '%'; small = 'got it right: ' + c.q; foot = `${t.right} of ${t.n}`; }
    n++; x.fillStyle = css('--night-2'); x.beginPath(); x.roundRect ? x.roundRect(80, y, W - 160, 210, 28) : x.rect(80, y, W - 160, 210); x.fill();
    x.fillStyle = css('--gold'); x.font = '92px "Bowlby One"'; x.fillText(big, 116, y + 118);
    x.fillStyle = css('--muted'); x.font = '700 26px "IBM Plex Mono"'; x.fillText(foot, 120, y + 170);
    x.fillStyle = css('--text'); x.font = '700 30px "IBM Plex Mono"'; wrap(small, 410, y + 75, W - 530, 40); y += 240; });
  x.fillStyle = css('--muted'); x.font = '700 28px "IBM Plex Mono"'; x.fillText('Real answers from members who played', 80, H - 140);
  x.fillStyle = css('--gold'); x.font = '40px "Bowlby One"'; x.fillText('OFFCAMPUSONTARIO.CA/CLUBS', 80, H - 80);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png')), file = new File([blob], 'club-results.png', { type:'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file] }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'club-results.png'; a.click(); toast('SAVED THE IMAGE');
}

/* ================= start ================= */
(function start(){
  const q = new URLSearchParams(location.search);
  const slug = (location.pathname.match(/\/club\/([a-z0-9-]+)/) || [])[1] || q.get('c');
  if (!slug || q.has('new')) return builder1();
  loadGame(slug);
})();
</script>
