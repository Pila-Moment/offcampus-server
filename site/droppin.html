<style>
/* Layout: Limestone City field kit. Photo on top, our own drawn map of Kingston below,
   a nixie-tube year dial at thumb height. Reveal rewinds the photo through a film projector to its year. */
:root{
  --lake:#0C2B35;
  --lake-2:#123A47;
  --water:#3E7F95;
  --stone:#E6E0D2;
  --stone-2:#CFC6B2;
  --stone-3:#B5AA92;
  --park:#C7CDA8;
  --road:#FFFFFF;
  --ink:#151A1C;
  --pin:#FF5A1F;
  --pin-deep:#B83506;
  --amber:#FFB23F;
  --amber-glow:#FF8A1A;
  --mint:#7FE0C4;
  --p3:#FFD84D;
  --p4:#FF7AC6;
  --p5:#A99BFF;
  --p6:#C6F25A;
  --p7:#5AD2F2;
  --p8:#F2F2F2;
  --muted:#9DB5BC;
  --head:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --ease-pop:cubic-bezier(.2,1.4,.4,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--lake);color:var(--stone);font-family:var(--mono);font-size:15px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{min-height:100%;max-width:1180px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:0 20px;border-radius:12px;
  background:var(--pin);color:var(--ink);font-family:var(--head);font-weight:900;font-size:26px;letter-spacing:.04em;text-transform:uppercase;
  box-shadow:0 6px 0 var(--pin-deep);transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out), background .2s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pin-deep)}
.btn[disabled]{background:var(--lake-2);color:var(--muted);box-shadow:0 6px 0 var(--ink);pointer-events:none}
.btn.stone{background:var(--stone);box-shadow:0 6px 0 var(--stone-3)}
.btn.ghost{background:transparent;color:var(--stone);box-shadow:inset 0 0 0 2px var(--stone-3);min-height:52px;font-size:20px}
.sound{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.08em;box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--stone)}
.sound svg{width:17px;height:17px}

/* ---------- title ---------- */
.title{flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center;padding-block:10px}
.title .top{display:flex;justify-content:space-between;align-items:center}
.kicker{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--mint)}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--stone);color:var(--ink);padding:22px 20px 24px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background:
   repeating-linear-gradient(0deg, transparent 0 26px, var(--stone-2) 26px 28px),
   repeating-linear-gradient(90deg, transparent 0 54px, var(--stone-2) 54px 56px);}
.hero h1{margin:0;font-family:var(--head);font-weight:900;text-transform:uppercase;line-height:.8;font-size:clamp(72px,24vw,170px);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--pin)}
.hero .ed{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;background:var(--ink);color:var(--stone);font-family:var(--head);font-weight:800;font-size:clamp(22px,6.5vw,34px);letter-spacing:.06em}
.hero .pinmark{position:absolute;right:14px;top:16px;width:clamp(56px,16vw,96px);animation:bob 2.4s var(--ease-out) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;font-size:15px;line-height:1.35}
.rules b{font-family:var(--head);font-size:24px;line-height:1;color:var(--amber)}
.fine{margin:0;font-size:12px;color:var(--muted);line-height:1.4}

/* ---------- round ---------- */
.round{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud .rn{font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.04em;white-space:nowrap}
.hud .rn span{color:var(--muted)}
.hud .tot{font-family:var(--head);font-weight:800;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .tot small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin-right:6px;font-weight:600}
.stage{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.photo{position:relative;height:38vh;min-height:200px;border-radius:12px;overflow:hidden;background:var(--ink);transition:height .5s var(--ease-out)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.02)}
.photo .zoom{position:absolute;right:8px;bottom:8px;padding:6px 10px;border-radius:8px;background:color-mix(in srgb, var(--ink) 75%, transparent);font-size:11px;font-weight:600;letter-spacing:.08em}
.photo .shutter{position:absolute;inset:0;background:var(--stone);pointer-events:none;animation:shutter .5s ease-out forwards}
@keyframes shutter{from{opacity:1}to{opacity:0}}
.mapwrap{position:relative;flex:1;min-height:230px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--stone-3)}
#map{position:absolute;inset:0;background:var(--stone)}
.maphint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:500;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--stone);font-size:12px;font-weight:600;letter-spacing:.06em;pointer-events:none;white-space:nowrap;transition:opacity .3s}
.maphint.gone{opacity:0}
.mapbtns{position:absolute;right:8px;bottom:22px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:42px;height:42px;border-radius:10px;background:var(--ink);color:var(--stone);font-family:var(--head);font-weight:900;font-size:24px;line-height:1}
.yearbar{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.yearbar .step{height:56px;border-radius:12px;background:var(--lake-2);font-family:var(--head);font-weight:900;font-size:30px;box-shadow:inset 0 0 0 2px var(--lake-2), 0 4px 0 var(--ink)}
.yearbar .step:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nixie{display:flex;justify-content:center;gap:5px}
.nixie i{position:relative;display:grid;place-items:center;width:clamp(40px,12vw,58px);height:58px;border-radius:12px 12px 8px 8px;font-style:normal;
  background:radial-gradient(80% 70% at 50% 40%, color-mix(in srgb, var(--amber-glow) 16%, var(--ink)) 0%, var(--ink) 75%);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--amber) 30%, transparent);
  font-family:var(--head);font-weight:700;font-size:44px;color:var(--amber);text-shadow:0 0 6px var(--amber-glow), 0 0 18px var(--amber-glow);font-variant-numeric:tabular-nums}
.nixie i::after{content:"";position:absolute;inset:6px;border-radius:8px;background:repeating-linear-gradient(60deg, transparent 0 5px, color-mix(in srgb, var(--amber) 8%, transparent) 5px 6px);pointer-events:none}
.yrange{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
.yrange::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg, var(--stone-3), var(--amber))}
.yrange::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg, var(--stone-3), var(--amber))}
.yrange::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--ink), 0 0 16px var(--amber-glow)}
.yrange::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--ink), 0 0 16px var(--amber-glow)}
.ylabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-6px}
.when{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--mint)}

/* pins */
.pin-ico{width:36px;height:46px}
.pin-ico.drop{animation:pindrop .45s var(--ease-pop)}
@keyframes pindrop{0%{transform:translateY(-60px) scale(.6);opacity:0}70%{transform:translateY(4px) scale(1.05);opacity:1}100%{transform:none}}
.flag-ico{width:40px;height:48px;animation:flagup .6s var(--ease-pop)}
@keyframes flagup{from{transform:scale(0) translateY(20px);opacity:0}}
.dist-chip{width:max-content;background:var(--ink);color:var(--amber);font-family:var(--head);font-weight:800;font-size:18px;padding:3px 9px;border-radius:7px;white-space:nowrap;box-shadow:0 3px 0 var(--pin-deep)}
.map-label{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.08em;color:var(--ink);white-space:nowrap;text-transform:uppercase;
  text-shadow:-1px -1px 0 var(--stone),1px -1px 0 var(--stone),-1px 1px 0 var(--stone),1px 1px 0 var(--stone);pointer-events:none}
.map-label.area{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--stone-3)}
.map-label.water{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.2em;color:color-mix(in srgb, var(--stone) 80%, var(--water));text-shadow:none;font-style:italic}
.leaflet-container{font-family:var(--mono);background:var(--stone)}
.leaflet-control-attribution{font-size:9px!important;background:color-mix(in srgb, var(--stone) 85%, transparent)!important;color:var(--ink)!important}
.leaflet-control-attribution a{color:var(--ink)!important}
.m-water{fill:var(--water);fill-opacity:1;stroke:none}
.m-park{fill:var(--park);fill-opacity:1;stroke:none}
.m-bldg{fill:var(--stone-2);fill-opacity:1;stroke:var(--stone-3);stroke-width:.6}
.m-campus{fill:color-mix(in srgb, var(--stone-2) 70%, var(--amber));fill-opacity:.35;stroke:none}
.m-case{stroke:var(--stone-3);fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-road{stroke:var(--road);fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-path{stroke:var(--stone-3);fill:none;stroke-dasharray:2 4;stroke-linecap:round}
.m-rail{stroke:var(--ink);fill:none;stroke-opacity:.35;stroke-dasharray:6 4}
.m-line{stroke:var(--ink);stroke-width:3;stroke-dasharray:8 8;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}

/* reveal mode */
body.reveal .photo{height:96px;min-height:0}
body.reveal .mapwrap{min-height:260px}
.result{display:flex;flex-direction:column;gap:10px}
.rcard{border-radius:12px;background:var(--stone);color:var(--ink);overflow:hidden}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px 6px}
.rhead h2{margin:0;font-family:var(--head);font-weight:900;font-size:clamp(26px,7.5vw,38px);line-height:.92;text-transform:uppercase;text-wrap:balance}
.rhead .yr{font-family:var(--head);font-weight:900;font-size:clamp(30px,8.5vw,44px);line-height:.9;color:var(--pin)}
.rblurb{margin:0;padding:0 14px 10px;font-size:13px;line-height:1.45}
.rstats{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.rstats div{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.rstats div + div{border-left:2px solid var(--ink)}
.rstats small{font-size:10px;font-weight:700;letter-spacing:.14em}
.rstats b{font-family:var(--head);font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.rstats span{font-size:12px;line-height:1.3}
.rtotal{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ink);color:var(--stone)}
.rtotal small{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.rtotal b{font-family:var(--head);font-weight:900;font-size:34px;color:var(--amber);font-variant-numeric:tabular-nums}
.verdict{display:inline-block;align-self:flex-start;padding:5px 10px;background:var(--amber);color:var(--ink);font-family:var(--head);font-weight:900;font-size:20px;letter-spacing:.05em;text-transform:uppercase;transform:rotate(-2deg);animation:stamp .5s var(--ease-pop)}
.verdict.bad{background:var(--stone-3)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.credit{margin:0;font-size:10px;line-height:1.4;color:var(--muted)}
.credit a{color:var(--muted)}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:2000;background:color-mix(in srgb, var(--ink) 94%, transparent);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:fade .2s}
.lightbox img{max-width:100vw;max-height:88vh;object-fit:contain}
.lightbox .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px, env(safe-area-inset-right,0px));height:44px;padding:0 16px;border-radius:999px;background:var(--stone);color:var(--ink);font-weight:700;letter-spacing:.08em}
@keyframes fade{from{opacity:0}}

/* ---------- the rewind: the photo runs back through a film projector to its year ---------- */
#tm{position:fixed;inset:0;z-index:3000;display:none;background:var(--ink);overflow:hidden}
#tm.on{display:block;animation:fade .25s ease-out}
#tm.out{opacity:0;transition:opacity .45s ease-in}
.tm-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.18);filter:sepia(1) contrast(1.35) brightness(.42) blur(1.5px);transition:transform 2.8s cubic-bezier(.3,0,.2,1), filter .6s ease-out}
#tm.run .tm-photo{transform:scale(1.04)}
#tm.landed .tm-photo{filter:sepia(.15) contrast(1.05) brightness(.38) blur(0)}
#tm canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
.sprocket{position:absolute;top:0;bottom:0;width:clamp(26px,7vw,46px);background-color:var(--ink);
  background-image:radial-gradient(ellipse 34% 30% at 50% 50%, var(--stone) 92%, transparent 100%);background-size:100% clamp(30px,8vw,48px);opacity:.92}
.sprocket.l{left:0;box-shadow:inset -3px 0 0 color-mix(in srgb, var(--stone) 18%, transparent)}
.sprocket.r{right:0;box-shadow:inset 3px 0 0 color-mix(in srgb, var(--stone) 18%, transparent)}
.tm-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;padding:0 50px}
.tm-core .lbl{font-family:var(--mono);color:var(--amber);font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 2px 10px var(--ink)}
.reel{display:flex;gap:.06em;font-family:var(--head);font-weight:900;font-size:clamp(96px,30vw,190px);line-height:1;color:var(--stone);text-shadow:0 6px 30px var(--ink);height:1em;overflow:hidden;font-variant-numeric:tabular-nums;
  -webkit-mask-image:linear-gradient(transparent, #000 18%, #000 82%, transparent);mask-image:linear-gradient(transparent, #000 18%, #000 82%, transparent)}
.reel span{display:block;width:.56em;text-align:center}
.reel .col{display:flex;flex-direction:column;transition:transform .14s linear}
#tm.landed .reel{-webkit-mask-image:none;mask-image:none;animation:slam .55s var(--ease-pop)}
#tm.landed .reel .col{transition:transform .5s var(--ease-pop)}
@keyframes slam{0%{transform:scale(1.35);color:var(--amber)}60%{color:var(--amber)}100%{transform:none}}
.tm-sub{font-family:var(--head);font-weight:800;font-size:clamp(18px,5vw,26px);letter-spacing:.12em;color:var(--stone);text-transform:uppercase;min-height:1.2em;text-align:center;text-shadow:0 2px 10px var(--ink)}
.tm-bar{width:min(320px,62vw);height:6px;background:color-mix(in srgb, var(--pin) 90%, transparent);transform:scaleX(0);transform-origin:left}
#tm.landed .tm-bar{transform:none;transition:transform .5s var(--ease-out) .1s}
.tm-skip{position:absolute;z-index:4;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);height:40px;padding:0 16px;border-radius:999px;color:var(--muted);font-size:12px;letter-spacing:.12em;box-shadow:inset 0 0 0 1.5px var(--muted)}
.flash{position:absolute;inset:0;z-index:5;background:var(--stone);animation:flashout .6s ease-out forwards;pointer-events:none}
@keyframes flashout{from{opacity:1}to{opacity:0}}

/* ---------- final ---------- */
.final{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:6px}
.final .big{font-family:var(--head);font-weight:900;font-size:clamp(76px,24vw,150px);line-height:.85;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 30px color-mix(in srgb, var(--amber-glow) 45%, transparent)}
.final .of{font-size:13px;color:var(--muted);letter-spacing:.1em}
.final .rank{align-self:flex-start;padding:8px 14px;background:var(--pin);color:var(--ink);font-family:var(--head);font-weight:900;font-size:clamp(26px,8vw,40px);text-transform:uppercase;transform:rotate(-2deg);box-shadow:5px 5px 0 var(--ink)}
.rows{display:grid;gap:8px}
.rowx{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;background:var(--lake-2)}
.rowx img{width:64px;height:48px;object-fit:cover;border-radius:6px;display:block}
.rowx b{display:block;font-family:var(--head);font-weight:800;font-size:19px;line-height:1;text-transform:uppercase}
.rowx span{font-size:11px;color:var(--muted)}
.rowx em{font-style:normal;font-family:var(--head);font-weight:900;font-size:24px;color:var(--amber);font-variant-numeric:tabular-nums}
.copied{font-size:12px;color:var(--mint);min-height:1.2em;text-align:center}

.modes{display:grid;gap:12px}
.btn small{display:block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;margin-top:2px;opacity:.85}
.modes .btn{flex-direction:column;gap:0;min-height:68px}
.setup{flex:1;display:flex;flex-direction:column;gap:14px}
.setup .top{display:flex;justify-content:space-between;align-items:center}
.setup h2{margin:0;font-family:var(--head);font-weight:900;font-size:clamp(44px,13vw,72px);line-height:.9}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;height:58px;border:0;border-radius:12px;padding:0 14px;background:var(--stone);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:19px;box-sizing:border-box}
.addrow .btn{width:auto;flex:0 0 auto;min-height:58px;font-size:22px}
.plist{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;align-content:flex-start}
.pchip{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:999px;background:var(--lake-2);font-weight:700}
.pchip i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--ink)}
.pchip button{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--lake);color:var(--muted);font-size:18px}
.pass{flex:1;display:flex;flex-direction:column;gap:16px}
.pass-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.pass-name{font-family:var(--head);font-weight:900;font-size:clamp(64px,22vw,150px);line-height:.85;text-transform:uppercase;overflow-wrap:anywhere;animation:stamp .5s var(--ease-pop) both;text-shadow:0 0 30px color-mix(in srgb, currentColor 40%, transparent)}
.who-chip{padding:6px 12px;border-radius:999px;background:var(--c);color:var(--ink);font-family:var(--head);font-weight:900;font-size:20px;text-transform:uppercase;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prows{display:grid;border-top:2px solid var(--ink)}
.prow{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--stone-2);animation:wordin .35s var(--ease-out) both}
.prow .pdot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--ink)}
.prow b{display:block;font-family:var(--head);font-weight:900;font-size:20px;line-height:1;text-transform:uppercase}
.prow span{font-size:11px}
.prow em{font-style:normal;font-family:var(--head);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.prow:first-child{background:color-mix(in srgb, var(--amber) 35%, var(--stone))}
@keyframes wordin{from{opacity:0;transform:translateY(8px)}}
.btn.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:700;box-shadow:0 6px 0 var(--stone-3), 0 0 0 6px var(--lake)}
.champ{font-family:var(--head);font-weight:900;font-size:clamp(60px,20vw,130px);line-height:.85;text-transform:uppercase;overflow-wrap:anywhere;animation:stamp .6s var(--ease-pop) both}
.rowx.standing{grid-template-columns:44px 1fr auto}
.rowx .place{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--ink);font-family:var(--head);font-weight:900;font-size:24px}
#lower{transition:opacity .5s ease, transform .6s var(--ease-out)}
.mapwrap{transition:min-height .55s var(--ease-out)}
body.reveal .round.stage1 .mapwrap{min-height:58vh}
body.reveal .round.stage1 #lower{opacity:0;transform:translateY(50px);pointer-events:none}
.yearflag{position:absolute;left:10px;top:10px;z-index:600;display:flex;flex-direction:column;padding:8px 12px 10px;background:var(--ink);color:var(--amber);border-radius:10px;box-shadow:0 5px 0 var(--pin-deep);animation:stamp .55s var(--ease-pop) both;max-width:70%;pointer-events:none}
.yearflag small{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--mint)}
.yearflag b{font-family:var(--head);font-weight:900;font-size:clamp(48px,14vw,80px);line-height:.85;text-shadow:0 0 18px var(--amber-glow)}
.yearflag span{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--stone);line-height:1.05;margin-top:2px}
body.reveal .round:not(.stage1) .yearflag b{font-size:clamp(30px,8vw,48px)}
.verdict{font-size:clamp(20px,6vw,28px)}
/* ---------- glow layer ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx .floor{position:absolute;left:-60%;right:-60%;bottom:-6%;height:50%;
  background-image:linear-gradient(color-mix(in srgb, var(--mint) 45%, transparent) 1.5px, transparent 1.5px),linear-gradient(90deg, color-mix(in srgb, var(--mint) 45%, transparent) 1.5px, transparent 1.5px);
  background-size:64px 64px;transform:perspective(420px) rotateX(64deg);transform-origin:50% 0;animation:floorrun 3s linear infinite;
  -webkit-mask-image:linear-gradient(to top, black 10%, transparent 85%);mask-image:linear-gradient(to top, black 10%, transparent 85%);opacity:.4}
@keyframes floorrun{to{background-position:0 64px}}
.bgfx .orb{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(80px);opacity:.22}
.bgfx .orb.a{background:var(--amber-glow);right:-14vmax;top:-16vmax;animation:drift1 16s ease-in-out infinite alternate}
.bgfx .orb.b{background:var(--mint);left:-16vmax;bottom:-12vmax;animation:drift2 18s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-10vmax,8vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(10vmax,-6vmax) scale(.9)}}
.bgfx .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg, transparent 0 3px, color-mix(in srgb, var(--ink) 18%, transparent) 3px 4px);opacity:.5}
.hero{box-shadow:0 0 50px color-mix(in srgb, var(--amber-glow) 30%, transparent)}
.photo,.mapwrap{box-shadow:0 0 0 2px color-mix(in srgb, var(--mint) 35%, transparent), 0 0 30px color-mix(in srgb, var(--mint) 22%, transparent)}
.btn{box-shadow:0 6px 0 var(--pin-deep), 0 0 26px color-mix(in srgb, var(--pin) 45%, transparent)}
.btn.stone{box-shadow:0 6px 0 var(--stone-3), 0 0 22px color-mix(in srgb, var(--stone) 25%, transparent)}
.btn[disabled]{box-shadow:0 6px 0 var(--ink)}
/* ---------- TV / laptop mode ---------- */
@media (min-width:1100px) and (min-aspect-ratio:5/4){
  #app{max-width:min(96vw,180vh);padding-block:2.2vh}
  .round{gap:1.4vh}
  .hud .rn,.hud .tot{font-size:4.2vh}

er night fire show in Springer Market Square, right behind City Hall. Every phone in the crowd is filming.", "credit": "Autharite", "license": "CC BY-SA 2.0", "source": "https://commons.wikimedia.org/wiki/File:UCV_DSC04730_(22407143385).jpg"}, {"id": "pitapit2019", "img": "photos/pitapit2019.jpg", "year": 2019, "lat": 44.2332, "lng": -76.49255, "group": "pitapit", "title": "The very first Pita Pit", "blurb": "Pita Pit started right here on Princess Street in 1995, by two Queen's students. Now it's worldwide.", "credit": "Kiwichenier", "license": "CC BY-SA 4.0", "source": "https://commons.wikimedia.org/wiki/File:PitaPit,_Princess_St_Kingston_ON,_Apr_2019.jpg"}, {"id": "richardson2019", "img": "photos/richardson2019.jpg", "year": 2019, "lat": 44.22746, "lng": -76.51645, "group": "richardson", "title": "Richardson Stadium", "blurb": "A packed Gaels game on October 19, 2019, Homecoming weekend. Out on West Campus, a long walk from the University District.", "credit": "ChaGheill", "license": "CC BY-SA 4.0", "source": "https://commons.wikimedia.org/wiki/File:Queen%27s_Football_at_Richardson.jpg"}, {"id": "skeleton2019", "img": "photos/skeleton2019.jpg", "year": 2019, "lat": 44.23595, "lng": -76.48831, "group": "mcburney", "title": "Skeleton Park Arts Festival", "blurb": "Stilt walkers at the Skeleton Park Arts Festival. It's officially McBurney Park, but it was the town cemetery until the 1860s and a lot of the bodies are still down there.", "credit": "Timelapse21", "license": "CC BY-SA 4.0", "source": "https://commons.wikimedia.org/wiki/File:Women_with_wings.jpg"}, {"id": "leons2021", "img": "photos/leons2021.jpg", "year": 2021, "lat": 44.23335, "lng": -76.47944, "group": "arena", "title": "Leon's Centre", "blurb": "Kingston's downtown arena, where the Frontenacs play. Since 2024 it's been called Slush Puppie Place.", "credit": "Hinto", "license": "CC BY-SA 4.0", "source": "https://commons.wikimedia.org/wiki/File:2021-07_Leons_Centre.jpg"}, {"id": "mcd2023", "img": "phot ted_Church,_Kingston_Ontario_2009-Sep-11.jpg"}, {"id": "goodes2015", "img": "photos/goodes2015.jpg", "year": 2015, "lat": 44.2282, "lng": -76.49797, "group": "goodes", "title": "Goodes Hall", "blurb": "Home of Smith School of Business. The old part was a school built in the 1890s; the glass wing came later. Commerce kids, this one's yours.", "credit": "JustSomePics", "license": "CC BY-SA 4.0", "source": "https://commons.wikimedia.org/wiki/File:Goodes_Hall_Queens_2015.jpg"}, {"id": "grant2023", "img": "photos/grant2023.jpg", "year": 2023, "lat": 44.22602, "lng": -76.49512, "group": "grant", "title": "Grant Hall", "blurb": "The clock tower you can see from all over campus, on a fall evening during Hoco season.", "credit": "Takipoint123", "license": "CC BY-SA 4.0", "source": "https://commons.wikimedia.org/wiki/File:Grant_Hall_(Queen%27s_University_at_Kingston).jpg"}, {"id": "pen2013", "img": "photos/pen2013.jpg", "year": 2013, "lat": 44.2204, "lng": -76.5134, "group": "pen", "title": "Kingston Penitentiary", "blurb": "The front gate of Kingston Pen on King Street West, the year it closed. It's a short walk from West Campus. Now you can tour it.", "credit": "Marie from Malang", "license": "CC BY-SA 2.0", "source": "https://commons.wikimedia.org/wiki/File:Kingston_Penitentiary_(8990525160).jpg"}, {"id": "mcburney2024", "img": "photos/mcburney2024.jpg", "year": 2024, "lat": 44.23595, "lng": -76.48831, "group": "mcburney", "title": "Skeleton Park", "blurb": "Officially McBurney Park, but everyone calls it Skeleton Park, because it used to be a cemetery.", "credit": "Acediscovery, cropped", "license": "CC BY 4.0", "source": "https://commons.wikimedia.org/wiki/File:McBurney-Park-Kingston-Ontario-May-2024.jpg"}, {"id": "cityhall2017", "img": "photos/cityhall2017.jpg", "year": 2017, "lat": 44.22992, "lng": -76.48045, "group": "cityhall", "title": "Kingston City Hall", "blurb": "City Hall, across from Confederation Park. Where every photo from your parents' visit gets taken.", let map = null, mapData = null, mapDataP = null, pinMarker = null, flagMarker = null, lineLayer = null, chipLayer = null, onPick = null;
function loadMapData(){

}
async function buildMap(el){

    const poly = (arr, cls) => arr && arr.length && L.polygon(arr, { className:cls, interactive:false, smoothFactor:1 }).addTo(map);
    const lines = (arr, cls, w) => arr && arr.length && L.polyline(arr, { className:cls, weight:w, interactive:false, smoothFactor:1 }).addTo(map);
    poly(d.campus, 'm-campus');
    poly(d.parks, 'm-park');
    poly(d.water, 'm-water');
    poly(d.bldg, 'm-bldg');
    lines(d.path, 'm-path', 1.5);
    lines(d.rail, 'm-rail', 2);
    const minorCase = lines(d.minor, 'm-case', 5), majorCase = lines(d.major, 'm-case', 8.5);
    const minor = lines(d.minor, 'm-road', 3.2), major = lines(d.major, 'm-road', 6);

function pickRounds(){
  // one photo per place, and a mix of old and recent photos every game
  if (Array.isArray(window.__force)) return window.__force.map(id => PHOTOS.find(p => p.id === id)).filter(Boolean); // preview hook for testing
  const seen = new Set();
  const uniq = shuffle(PHOTOS.slice()).filter(p => !seen.has(p.group) && seen.add(p.group));
  const old = uniq.filter(p => p.year < 1950), recent = uniq.filter(p => p.year >= 1950);

  return shuffle(pick.concat(uniq.filter(p => !pick.includes(p))).slice(0, ROUNDS_PER_GAME));
}

}

    $('#hint').classList.add('gone');
    const b = $('#lock'); b.disabled = false; b.textContent = 'LOCK IT IN';
  };
  $('#zin').onclick = () => map.zoomIn(); $('#zout').onclick = () => map.zoomOut();
  const setYear = (y, sound) => {
    y = Math.max(YEAR_MIN, Math.min(YEAR_MAX, y));
    if (y === G.year) return; G.year = y; $('#nix').innerHTML = nixieHTML(y); $('#yr').value = y;
    if (sound) SFX.tick();
  };
  let lastTickYear = G.year;
  $('#yr').oninput = e => { const y = +e.target.value; if (Math.abs(y - lastTickYear) >= 3) { SFX.tick(); lastTickYear = y; } setYear(y, false); };
  const hold = (btn, delta) => {
    let t1 = null, t2 = null;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener('pointerdown', e => { e.preventDefault(); setYear(G.year + delta, true); vibe(5); t1 = setTimeout(() => { t2 = setInterval(() => setYear(G.year + delta, true), 70); }, 380); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  };
  hold($('#ym'), -1); hold($('#yp'), 1);
  $('#lock').onclick = lockIn;
}

function setPin(latlng, col){
  const icon = L.divIcon({ className:'', html:pinSvg(col || 'var(--pin)', ''), iconSize:[36,46], iconAnchor:[18,45] });
  if (pinMarker) pinMarker.setLatLng(latlng);
  else { pinMarker = L.marker(latlng, { icon, draggable:true, keyboard:false, autoPan:true }).addTo(map); pinMarker.on('dragend', () => { G.guess = pinMarker.getLatLng(); SFX.pin(); vibe(15); }); }
}

function lightbox(src){
  const d = document.createElement('div'); d.className = 'lightbox';
  d.innerHTML = `<img src="${esc(src)}" alt="Photo, full size"><button class="close">CLOSE</button>`;
  d.onclick = () => d.remove(); document.body.appendChild(d); SFX.tap();
}

async function lockIn(){
  if (G.locked || !G.guess) return; G.locked = true;
  vibe([30, 40, 60]);
  G.roundGuesses[G.turn] = { latlng: G.guess, year: G.year };
  if (G.party && G.turn < G.players.length - 1) { SFX.ok(); G.turn++; return startTurn(); }
  const P = G.rounds[G.i];
  const rs = G.players.map((pl, k) => {
    const g = G.roundGuesses[k];
    const d = metres(g.latlng, { lat:P.lat, lng:P.lng }), dy = g.year - P.year;
    const r = { k, photo:P, guess:g.latlng, guessYear:g.year, dist:d, dy, place:placePts(d), when:yearPts(dy) };
    r.total = r.place + r.when; pl.results.push(r); return r;
  });
  const years = G.roundGuesses.map(g => g.year).sort((a, b) => a - b);
  await timeMachine(years[Math.floor(years.length / 2)], P.year, P);
  showReveal(rs);
}

/* ---------------- the rewind ---------------- */
function reelHTML(y){ return String(y).split('').map(() => `<span class="col">${'0123456789'.split('').map(d => `<span>${d}</span>`).join('')}</span>`).join(''); }
function setReel(el, y){
  const s = String(y); if (el.children.length !== s.length) el.innerHTML = reelHTML(y);
  [...el.children].forEach((c, i) => c.style.transform = `translateY(${-Number(s[i])}em)`);
}
function timeMachine(from, to, photo){
  return new Promise(resolve => {
    const tm = $('#tm'), cv = $('#grain'), reel = $('#tmReel'), sub = $('#tmSub'), lbl = $('#tmLbl'), img = $('#tmImg');
    const spl = $('#spl'), spr = $('#spr');
    let done = false;
    const DUR = reduced ? 500 : 2600;
    img.src = photo ? photo.img : '';
    tm.className = 'on';
    lbl.textContent = from === to ? 'Holding the tape' : (to < from ? 'Rewinding the tape' : 'Fast-forwarding the tape');
    sub.textContent = G.party ? `The table said ${from}` : `You said ${from}`;
    reel.innerHTML = ''; setReel(reel, from);
    SFX.shutter();
    const ctx = cv.getContext('2d'); const dpr = 1;
    const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
    const css = getComputedStyle(document.documentElement);
    const C = css.getPropertyValue('--stone').trim(), A = css.getPropertyValue('--amber').trim();
    let start = null, raf = 0, film = 0, last = from;
    const ease = p => 1 - Math.pow(1 - p, 3);
    function frame(now){
      if (!start) start = now;
      const p = Math.min(1, (now - start) / DUR), speed = (1 - p) * 60 + 2;
      film += speed; spl.style.backgroundPositionY = spr.style.backgroundPositionY = (to < from ? -film : film) + 'px';
      // film grain, dust and scratches
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = .05 + Math.random() * .08 * (1 - p); ctx.fillStyle = A; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C;
      for (let k = 0; k < 70; k++) { ctx.globalAlpha = Math.random() * .5; const r = Math.random() * 2.2; ctx.fillRect(Math.random() * W, Math.random() * H, r, r); }
      ctx.strokeStyle = C; ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) if (Math.random() < .6) { ctx.globalAlpha = .15 + Math.random() * .25; const x = Math.random() * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (Math.random() - .5) * 20, H); ctx.stroke(); }
      ctx.globalAlpha = 1;
      const y = Math.round(from + (to - from) * ease(p));
      if (y !== last) { last = y; setReel(reel, y); }
      if (p < 1 && !done) raf = requestAnimationFrame(frame); else finish();
    }
    setTimeout(() => { if (done) return; tm.classList.add('run'); SFX.engage(DUR / 1000); raf = requestAnimationFrame(frame); }, reduced ? 0 : 350);
    function finish(){
      if (done) return; done = true; cancelAnimationFrame(raf);
      ctx.clearRect(0, 0, W, H);
      setReel(reel, to); tm.classList.add('landed');
      lbl.textContent = 'This photo is from';
      const dy = to - from;
      sub.textContent = dy === 0 ? 'Dead on' : `${Math.abs(dy)} year${Math.abs(dy) === 1 ? '' : 's'} ${dy > 0 ? 'later' : 'earlier'} than ${G.party ? 'the table' : 'your'} guess`;
      SFX.land(); vibe([60, 30, 120]);
      const f = document.createElement('div'); f.className = 'flash'; tm.appendChild(f);
      setTimeout(() => { f.remove(); tm.classList.add('out'); }, reduced ? 40 : 1500);
      setTimeout(() => { tm.className = ''; resolve(); }, reduced ? 80 : 1950);
    }
    $('#tmSkip').onclick = () => { SFX.tap(); finish(); };
  });
}

/* ---------------- reveal ---------------- */
function verdictFor(r){
  if (r.total >= 9000) return ['ABSOLUTE LOCAL', true];
  if (r.total >= 7500) return ['YOU KNOW THIS TOWN', true];
  if (r.total >= 5500) return ['NOT BAD AT ALL', true];
  if (r.total >= 3500) return ['IN THE NEIGHBOURHOOD', false];
  if (r.total >= 1500) return ['TOURIST ENERGY', false];
  return ['WERE YOU EVEN HERE?', false];
}
function countUp(el, to, ms = 900){
  if (!el) return Promise.resolve();
  if (reduced) { el.textContent = fmt(to); return Promise.resolve(); }
  const s = performance.now(); let last = 0;
  return new Promise(res => { (function f(now){ const p = Math.min(1, (now - s) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (now - last > 70 && p < 1) { SFX.tick(); last = now; } if (p < 1) requestAnimationFrame(f); else res(); })(s); });
}
const yearsText = (r, who) => r.dy === 0 ? 'Exact year!' : `${who} said ${r.guessYear}. ${Math.abs(r.dy)} year${Math.abs(r.dy) === 1 ? '' : 's'} ${r.dy > 0 ? 'late' : 'early'}.`;

async function showReveal(rs){
  document.body.classList.add('reveal');
  const roundEl = document.querySelector('.round'); if (roundEl) roundEl.classList.add('stage1');
  const P = rs[0].photo, last = G.i === G.rounds.length - 1;
  const solo = !G.party;
  const ranked = rs.slice().sort((a, b) => b.total - a.total);
  const best = ranked[0];
  const [vtxt, good] = solo ? verdictFor(best) : [`${G.players[best.k].name} takes it · +${fmt(best.total)}`, true];
  $('#lower').innerHTML = `
    <div class="result">
      <span class="verdict ${good ? '' : 'bad'}">${esc(vtxt)}</span>
      <div class="rcard">
        <div class="rhead"><h2>${esc(P.title)}</h2><span class="yr">${P.year}</span></div>
        <p class="rblurb">${esc(P.blurb)}</p>
        ${solo ? `
        <div class="rstats">
          <div><small>WHERE</small><b id="pplace">0</b><span>${distText(best.dist)} away</span></div>
          <div><small>WHEN</small><b id="pwhen">0</b><span>${yearsText(best, 'You')}</span></div>
        </div>
        <div class="rtotal"><small>ROUND TOTAL</small><b id="ptot">0</b></div>` : `
        <div class="prows">${ranked.map((r, i) => `<div class="prow" style="--c:${G.players[r.k].col};animation-delay:${600 + i * 160}ms"><span class="pdot"></span><div><b>${esc(G.players[r.k].name)}</b><span>${distText(r.dist)} off · ${r.dy === 0 ? 'exact year' : Math.abs(r.dy) + ' yrs off'}</span></div><em>${fmt(r.total)}</em></div>`).join('')}</div>`}
      </div>
      <p class="credit">${esc(P.credit)} · <a href="${esc(P.source)}" target="_blank" rel="noopener">${esc(P.license)}</a></p>
      <button class="btn stone sticky" id="nextB">${last ? (solo ? 'SEE YOUR SCORE' : 'FINAL STANDINGS') : 'NEXT PHOTO'}</button>
    </div>`;
  rs.forEach(r => G.players[r.k].total += r.total);
  $('#nextB').onclick = () => { SFX.tap(); vibe(15); if (last) finalScreen(); else nextRound(); };
  const ph = $('#photo'); if (ph) { const z = ph.querySelector('.zoom'); if (z) z.remove(); }
  const wc = document.querySelector('.who-chip'); if (wc) wc.remove();
  if (pinMarker) { map.removeLayer(pinMarker); pinMarker = null; }
  const mw = document.querySelector('.mapwrap');
  if (mw) mw.insertAdjacentHTML('beforeend', `<div class="yearflag"><small>IT WAS</small><b>${P.year}</b><span>${esc(P.title)}</span></div>`);
  SFX.ok(); vibe([30, 30, 60]);
  await wait(reduced ? 60 : 560);
  map.invalidateSize();
  const truth = L.latLng(P.lat, P.lng);
  const layers = [];
  rs.forEach(r => {
    const pl = G.players[r.k];
    layers.push(L.polyline([r.guess, truth], { className:'m-line', interactive:false }).addTo(map));
    layers.push(L.marker(r.guess, { icon: L.divIcon({ className:'', html: pinSvg(pl.col, solo ? '' : pl.name[0].toUpperCase()), iconSize:[36,46], iconAnchor:[18,45] }), keyboard:false, interactive:false }).addTo(map));
  });
  if (solo) {
    const mid = L.latLng((best.guess.lat + truth.lat) / 2, (best.guess.lng + truth.lng) / 2);
    layers.push(L.marker(mid, { icon: L.divIcon({ className:'', html:`<div class="dist-chip" id="dchip" style="transform:translate(-50%,-50%)">0 m</div>`, iconSize:[0,0] }), interactive:false, keyboard:false }).addTo(map));
  }
  flagMarker = L.marker(truth, { icon: L.divIcon({ className:'', html:FLAG_SVG, iconSize:[40,48], iconAnchor:[8,46] }), keyboard:false, interactive:false, zIndexOffset:1000 }).addTo(map);
  layers.forEach(l => G._layers = (G._layers || []).concat(l));
  const bnds = L.latLngBounds([truth, ...rs.map(r => r.guess)]).pad(.3);
  map.flyToBounds(bnds, { maxZoom:17, duration: reduced ? 0 : 1.1 });
  const chip = $('#dchip');
  if (chip && !reduced) { const t0 = performance.now(); await new Promise(res => { (function f(now){ const p = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - p, 3); chip.textContent = distText(best.dist * e); if (p < 1) requestAnimationFrame(f); else res(); })(t0); }); }
  else if (chip) chip.textContent = distText(best.dist);
  await wait(reduced ? 0 : (solo ? 700 : 1300));
  if (roundEl) roundEl.classList.remove('stage1');
  await wait(reduced ? 0 : 620);
  if (!document.body.contains(roundEl)) return;
  map.invalidateSize(); map.fitBounds(bnds, { maxZoom:17, animate:false });
  if (solo) {
    await countUp($('#pplace'), best.place, 800);
    await countUp($('#pwhen'), best.when, 800);
    await countUp($('#ptot'), best.total, 600);
  } else await wait(reduced ? 0 : 600 + rs.length * 160);
  if (!document.body.contains(roundEl)) return;
  const tot = document.querySelector('.hud .tot'); if (tot) tot.innerHTML = `<small>SCORE</small>${fmt(G.players[0].total)}`;
  if (best.total >= 7500) { SFX.great(); vibe([40, 30, 40, 30, 120]); } else if (best.total >= 3500) { SFX.ok(); vibe(40); } else { SFX.womp(); vibe([80, 60, 80]); }
}

/* ---------------- final ---------------- */
function rankFor(t){
  const max = MAX_PTS * 2 * G.rounds.length, f = t / max;
  if (f >= .9) return 'Limestone Legend';
  if (f >= .75) return 'Upper-Year Local';
  if (f >= .55) return 'Knows Princess St';
  if (f >= .35) return 'Frosh With a Map';
  return 'Lost on West Campus';
}
async function finalScreen(){
  document.body.classList.remove('reveal');
  if (map) { map.remove(); map = null; }
  const max = MAX_PTS * 2 * G.rounds.length;
  const solo = !G.party;
  const order = G.players.slice().sort((a, b) => b.total - a.total);
  const champ = order[0];
  app.innerHTML = `
  <section class="final">
    <div class="hud"><span class="kicker">DROP THE PIN · KINGSTON</span><span class="ocr"><a class="sound ochome" href="index.html">&larr; HOME</a>${soundBtn()}</span></div>
    ${solo ? '' : `<div class="of">THE WINNER IS</div><div class="champ" style="color:${champ.col}">${esc(champ.name)}</div>`}
    <div><div class="big" id="fbig">0</div><div class="of">OUT OF ${fmt(max)}</div></div>
    <div class="rank" id="frank" style="visibility:hidden">${esc(rankFor(champ.total))}</div>
    <div class="rows">${solo
      ? champ.results.map(r => `<div class="rowx"><img src="${esc(r.photo.img)}" alt=""><div><b>${esc(r.photo.title)}</b><span>${distText(r.dist)} off · ${r.dy === 0 ? 'exact year' : Math.abs(r.dy) + ' yrs off'}</span></div><em>${fmt(r.total)}</em></div>`).join('')
      : order.map((p, i) => `<div class="rowx standing" style="--c:${p.col}"><span class="place">${i + 1}</span><div><b>${esc(p.name)}</b><span>${esc(rankFor(p.total))}</span></div><em>${fmt(p.total)}</em></div>`).join('')}</div>
    <button class="btn" id="share">COPY ${solo ? 'MY SCORE' : 'THE RESULTS'}</button>
    <div class="copied" id="copied"></div>
    <button class="btn ghost" id="again">PLAY AGAIN</button>
  </section>`;
  wireSound();
  if (!solo) { SFX.land(); }
  await countUp($('#fbig'), champ.total, 1600);
  $('#frank').style.visibility = 'visible'; $('#frank').classList.add('verdict');
  SFX.fanfare(); vibe([60, 40, 60, 40, 200]);
  const text = solo
    ? `DROP THE PIN: KINGSTON\n${fmt(champ.total)} / ${fmt(max)} · ${rankFor(champ.total)}\n` + champ.results.map((r, i) => `${i + 1}. ${fmt(r.total)}`).join('  ')
    : `DROP THE PIN: KINGSTON\n` + order.map((p, i) => `${i + 1}. ${p.name} ${fmt(p.total)} (${rankFor(p.total)})`).join('\n');
  $('#share').onclick = async () => {
    SFX.tap();
    try { await navigator.clipboard.writeText(text); $('#copied').textContent = 'Copied. Paste it in the group chat.'; }
    catch (e) { $('#copied').textContent = text.replace(/\n/g, ' · '); }
  };
  $('#again').onclick = () => { SFX.tap(); newGame(G.players.map(p => p.name)); };
}

titleScreen();
})();
</script>
