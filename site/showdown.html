<title>Survey Showdown</title>

<style>
/* Layout: a late-night game-show stage in Queen's tricolour. Scoreboard strip on top,
   bulb-lit marquee board in the middle, a chunky control deck at thumb height. */
:root{
  --stage:#0A1036;
  --stage-2:#141D55;
  --tile:#2246E6;
  --tile-hi:#4F72FF;
  --tile-deep:#11258C;
  --gold:#FFC83D;
  --gold-deep:#B97F05;
  --red:#FF3B4A;
  --red-deep:#A80F1D;
  --cream:#FFF5DE;
  --ink:#0A0E26;
  --muted:#AEB8EC;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --marquee:"Bungee Inline","Bungee","Arial Black",Impact,sans-serif;
  --body:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --ease-pop:cubic-bezier(.2,1.4,.4,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--stage);
  background-image:
    radial-gradient(120% 60% at 50% -10%, var(--stage-2) 0%, transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in srgb, var(--stage-2) 55%, transparent) 46px 48px);
  color:var(--cream);
  font-family:var(--body);
  font-size:18px;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
#app{
  min-height:100%;
  max-width:1000px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 14px;
  box-sizing:border-box;
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- chunky buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:60px;padding:0 22px;border-radius:14px;
  font-family:var(--display);font-size:22px;letter-spacing:.02em;
  background:var(--gold);color:var(--ink);
  box-shadow:0 6px 0 var(--gold-deep);
  transition:transform .12s var(--ease-out), box-shadow .12s var(--ease-out);
  width:100%;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.red{background:var(--red);color:var(--cream);box-shadow:0 6px 0 var(--red-deep)}
.btn.red:active{box-shadow:0 1px 0 var(--red-deep)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--cream) 40%, transparent);min-height:52px;font-size:18px}
.btn.ghost:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px}
.row > *{flex:1;min-width:0}

/* ---------- title ---------- */
.title-screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:20px}
.topbar{display:flex;justify-content:flex-end}
.sound{
  display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;
  font-family:var(--display);font-size:12px;letter-spacing:.06em;
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--cream) 30%, transparent);
}
.sound svg{width:18px;height:18px}
.logo{position:relative;padding:26px 18px 30px;border-radius:22px;text-align:center;background:var(--gold-deep);isolation:isolate}
.logo::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background-image:radial-gradient(circle, var(--cream) 0 3px, color-mix(in srgb, var(--gold) 70%, transparent) 4px, transparent 6px);
  background-size:22px 22px;animation:chase 1.2s steps(2) infinite;
}
.logo-in{background:var(--stage);border-radius:14px;padding:22px 12px 26px;box-shadow:inset 0 0 0 3px var(--gold)}
.logo h1{margin:0;font-family:var(--marquee);font-weight:400;line-height:.92;font-size:clamp(38px,11.2vw,96px);color:var(--gold);text-wrap:balance;
  text-shadow:0 4px 0 var(--red-deep), 0 0 28px color-mix(in srgb, var(--gold) 45%, transparent)}
.logo h1 span{display:block;color:var(--cream)}
.ribbon{display:inline-block;margin-top:16px;padding:8px 16px;background:var(--red);color:var(--cream);font-family:var(--display);font-size:clamp(14px,4vw,20px);letter-spacing:.08em;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}
@keyframes chase{to{background-position:11px 0}}
.how{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;font-size:19px;line-height:1.2;font-weight:600;color:var(--cream)}
.how b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--tile);color:var(--gold);font-family:var(--display);font-size:18px;box-shadow:inset 0 0 0 2px var(--gold)}
.fine{margin:0;font-size:15px;color:var(--muted);text-align:center;font-weight:500}

/* ---------- team setup ---------- */
.setup{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px}
.setup h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,44px);line-height:1;color:var(--gold)}
.setup .sub{margin:-8px 0 0;color:var(--muted);font-size:18px;font-weight:600}
.namebox{display:grid;gap:6px}
.namebox label{font-family:var(--display);font-size:13px;letter-spacing:.08em}
.namebox.t0 label{color:var(--red)} .namebox.t1 label{color:var(--gold)}
.namebox input{
  height:60px;border-radius:12px;border:0;padding:0 16px;
  background:var(--cream);color:var(--ink);
  font-family:var(--display);font-size:22px;text-transform:uppercase;width:100%;box-sizing:border-box;
}
.namebox.t0 input{box-shadow:inset 0 0 0 4px var(--red)} .namebox.t1 input{box-shadow:inset 0 0 0 4px var(--gold)}
.vs{font-family:var(--display);color:var(--cream);text-align:center;font-size:20px;margin:-6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--stage-2);font-weight:700;font-size:17px;letter-spacing:.03em;box-shadow:inset 0 0 0 2px var(--tile)}
.chip:active{background:var(--tile)}
.spacer{flex:1}

/* ---------- in-game ---------- */
.game{flex:1;display:flex;flex-direction:column;gap:10px}
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.team{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-radius:12px;background:var(--stage-2);min-width:0;
  transition:box-shadow .25s var(--ease-out), transform .25s var(--ease-out)}
.team.t1{text-align:right}
.tname{font-family:var(--display);font-size:clamp(11px,3.2vw,15px);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t0 .tname{color:var(--red)} .t1 .tname{color:var(--gold)}
.tscore{font-family:var(--display);font-size:clamp(26px,7.5vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.team.on{transform:translateY(-2px)}
.team.t0.on{box-shadow:inset 0 0 0 3px var(--red), 0 0 22px color-mix(in srgb, var(--red) 45%, transparent)}
.team.t1.on{box-shadow:inset 0 0 0 3px var(--gold), 0 0 22px color-mix(in srgb, var(--gold) 45%, transparent)}
.team .tag{position:absolute;top:-9px;padding:2px 7px;border-radius:5px;font-family:var(--display);font-size:10px;letter-spacing:.06em;color:var(--ink);opacity:0;transition:opacity .2s}
.team.t0 .tag{left:8px;background:var(--red);color:var(--cream)} .team.t1 .tag{right:8px;background:var(--gold)}
.team.on .tag{opacity:1}
.bank{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:6px 12px;border-radius:12px;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep);position:relative}
.blabel{font-family:var(--display);font-size:11px;letter-spacing:.12em}
.bnum{font-family:var(--display);font-size:clamp(28px,8vw,42px);line-height:1;font-variant-numeric:tabular-nums}
.bnum.pop{animation:pop .45s var(--ease-pop)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.mult{position:absolute;top:-10px;right:-8px;padding:2px 6px;border-radius:6px;background:var(--red);color:var(--cream);font-family:var(--display);font-size:12px;transform:rotate(8deg)}

.roundline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.rlabel{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
@media (max-width:400px){.game .sound .lbl{display:none}.game .sound{padding:0 10px}}
.strikes{display:flex;gap:6px}
.strikes i{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--stage-2);box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--red) 40%, transparent)}
.strikes i.on{background:var(--red);box-shadow:none;animation:pop .4s var(--ease-pop)}
.strikes i.on::before{content:"";width:16px;height:16px;background:
  linear-gradient(45deg, transparent 42%, var(--cream) 42% 58%, transparent 58%),
  linear-gradient(-45deg, transparent 42%, var(--cream) 42% 58%, transparent 58%)}
.strikes[hidden]{display:none!important}

.qcard{position:relative;padding:14px 16px;border-radius:14px;background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep)}
.qcard p{margin:0;font-weight:800;font-size:clamp(20px,5.4vw,30px);line-height:1.08;text-wrap:balance}
.qcard p .w{display:inline-block;opacity:0;transform:translateY(8px);animation:wordin .32s var(--ease-out) forwards}
@keyframes wordin{to{opacity:1;transform:none}}

.marquee{position:relative;padding:10px;border-radius:18px;background:var(--gold-deep);isolation:isolate}
.marquee::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background-image:radial-gradient(circle, var(--cream) 0 2.5px, color-mix(in srgb, var(--gold) 70%, transparent) 3.5px, transparent 5px);
  background-size:18px 18px;animation:chase2 1s steps(2) infinite;
}
@keyframes chase2{to{background-position:9px 0}}
.board{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:8px;padding:8px;border-radius:10px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
.tile{position:relative;perspective:700px;height:clamp(56px,9.6vh,92px);min-width:0}
.tile-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s var(--ease-pop)}
.tile.open .tile-in{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;overflow:hidden}
.front{justify-content:center;background:linear-gradient(180deg, var(--tile-hi) 0%, var(--tile) 52%, var(--tile-deep) 100%);box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--cream) 22%, transparent)}
.front .num{display:grid;place-items:center;min-width:46px;height:34px;padding:0 6px;border-radius:50%;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:20px;box-shadow:inset 0 0 0 2px var(--gold)}
.back{transform:rotateX(180deg);background:var(--cream);color:var(--ink);justify-content:space-between;gap:6px;padding-left:10px}
.back .ans{flex:1;min-width:0;font-weight:800;font-size:clamp(14px,3.9vw,24px);line-height:1;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:break-word;text-wrap:balance}
.back .pts{align-self:stretch;display:grid;place-items:center;min-width:44px;padding:0 6px;background:var(--tile-deep);color:var(--cream);font-family:var(--display);font-size:clamp(17px,4.6vw,26px);font-variant-numeric:tabular-nums}
.tile.rest .back{background:color-mix(in srgb, var(--cream) 62%, var(--stage))}
.tile.rest .pts{background:color-mix(in srgb, var(--tile-deep) 60%, var(--stage))}
.tile.flash .back{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--gold)}30%{box-shadow:0 0 0 6px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}

.bubble{position:absolute;left:50%;top:50%;z-index:3;width:max-content;max-width:88%;padding:14px 20px;border-radius:16px;background:var(--cream);color:var(--ink);text-align:center;
  box-shadow:6px 6px 0 var(--ink);transform:translate(-50%,-50%) rotate(-2deg);animation:bub .35s var(--ease-pop)}
.bubble small{display:block;font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--red)}
.bubble b{display:block;font-weight:800;font-size:clamp(24px,7vw,40px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
@keyframes bub{from{transform:translate(-50%,-50%) scale(.3) rotate(-12deg);opacity:0}}

/* deck */
.deck{display:flex;flex-direction:column;gap:12px;padding-top:4px;margin-top:auto}
.plus{position:absolute;right:8px;top:-6px;z-index:5;font-family:var(--display);font-size:clamp(24px,7vw,38px);color:var(--gold);text-shadow:0 3px 0 var(--ink);pointer-events:none;animation:plus 1.1s var(--ease-out) forwards}
@keyframes plus{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-54px) scale(1)}}
.deck-head{display:flex;flex-direction:column;gap:2px}
.deck-label{font-family:var(--display);font-size:clamp(20px,6vw,30px);line-height:1}
.deck-label.t0{color:var(--red)} .deck-label.t1{color:var(--gold)}
.deck-help{margin:0;font-size:18px;font-weight:600;color:var(--muted);line-height:1.2}
.guess{display:flex;gap:8px}
.guess input{flex:1;min-width:0;height:62px;border:0;border-radius:14px;padding:0 16px;background:var(--cream);color:var(--ink);font-family:var(--body);font-weight:800;font-size:22px;text-transform:uppercase;box-sizing:border-box}
.guess input::placeholder{color:color-mix(in srgb, var(--ink) 45%, transparent);text-transform:none;font-weight:600}
.guess.t0 input{box-shadow:inset 0 0 0 4px var(--red)} .guess.t1 input{box-shadow:inset 0 0 0 4px var(--gold)}
.guess .btn{width:auto;flex:0 0 auto;min-height:62px;font-size:19px;padding:0 18px}
.guess.shake{animation:shake .35s}
.undo{align-self:flex-start;padding:8px 2px;font-weight:700;font-size:17px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.buzzers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.buzzer{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1/0.82;max-height:190px;width:100%;border-radius:50% 50% 22px 22px;
  font-family:var(--display);color:var(--ink);transition:transform .1s var(--ease-out), box-shadow .1s}
.buzzer b{font-size:clamp(26px,8vw,40px);font-weight:400;line-height:1}
.buzzer span{font-size:clamp(11px,3.2vw,15px);max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buzzer.t0{background:radial-gradient(70% 60% at 50% 30%, color-mix(in srgb, var(--cream) 40%, var(--red)) 0%, var(--red) 60%);box-shadow:0 10px 0 var(--red-deep);color:var(--cream)}
.buzzer.t1{background:radial-gradient(70% 60% at 50% 30%, color-mix(in srgb, var(--cream) 50%, var(--gold)) 0%, var(--gold) 60%);box-shadow:0 10px 0 var(--gold-deep)}
.buzzer:active,.buzzer.hit{transform:translateY(8px)}
.buzzer.t0:active,.buzzer.t0.hit{box-shadow:0 2px 0 var(--red-deep)}
.buzzer.t1:active,.buzzer.t1.hit{box-shadow:0 2px 0 var(--gold-deep)}
.buzzer::after{content:"";position:absolute;inset:-6px;border-radius:inherit;box-shadow:0 0 0 3px currentColor;opacity:0;animation:ring 1.6s ease-out infinite}
.buzzer.t1::after{color:var(--gold)} .buzzer.t0::after{color:var(--red)}
@keyframes ring{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.08)}}

/* fx layer */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;display:grid;place-items:center}
.xs{display:flex;gap:2vw;animation:xslam .9s var(--ease-pop)}
.xs svg{width:min(30vw,190px);height:min(30vw,190px);filter:drop-shadow(0 8px 0 var(--ink))}
@keyframes xslam{0%{transform:scale(2.6);opacity:0}25%{transform:scale(.92);opacity:1}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.fx-label{position:absolute;top:calc(50% + min(18vw,110px));font-family:var(--display);font-size:clamp(18px,5vw,28px);color:var(--cream);text-shadow:3px 3px 0 var(--red-deep);letter-spacing:.04em;animation:wordin .3s .15s var(--ease-out) both;text-align:center;padding:0 16px}
.banner{position:relative;width:100%;padding:18px 16px 20px;text-align:center;background:var(--gold);color:var(--ink);transform:rotate(-3deg);box-shadow:0 8px 0 var(--ink);animation:band .5s var(--ease-pop)}
.banner.red{background:var(--red);color:var(--cream)}
.banner.blue{background:var(--tile);color:var(--cream)}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(36px,11vw,76px);line-height:.95;text-wrap:balance}
.banner span{display:block;margin-top:6px;font-weight:800;font-size:clamp(16px,4.6vw,24px);letter-spacing:.04em;text-transform:uppercase}
@keyframes band{from{transform:rotate(-3deg) scaleX(0)}to{transform:rotate(-3deg) scaleX(1)}}
.fx-out{animation:fxout .3s ease-in forwards}
@keyframes fxout{to{opacity:0;transform:scale(.96)}}
.slam{text-align:center;animation:slam .6s var(--ease-pop)}
.slam b{display:block;font-family:var(--marquee);font-weight:400;font-size:clamp(56px,18vw,140px);line-height:.9;color:var(--gold);text-shadow:0 6px 0 var(--red-deep), 0 0 40px color-mix(in srgb, var(--gold) 50%, transparent)}
.slam span{display:inline-block;margin-top:12px;padding:6px 14px;background:var(--red);color:var(--cream);font-family:var(--display);font-size:clamp(16px,5vw,26px);transform:rotate(-2deg)}
@keyframes slam{0%{transform:scale(3);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
.dim{position:fixed;inset:0;background:color-mix(in srgb, var(--ink) 70%, transparent);animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
body.shake #app{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* final */
.final{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center;padding-block:16px}
.final .crown{font-family:var(--display);font-size:16px;letter-spacing:.12em;color:var(--muted)}
.final .winner{font-family:var(--marquee);font-size:clamp(48px,15vw,110px);line-height:.92;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.final .winner.t0{color:var(--red);text-shadow:0 5px 0 var(--ink)} .final .winner.t1{color:var(--gold);text-shadow:0 5px 0 var(--red-deep)}
.final .tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.final .tally div{padding:14px 10px;border-radius:14px;background:var(--stage-2)}
.final .tally .tname{display:block}
.final .tally .tscore{display:block;font-size:clamp(34px,10vw,56px)}
.final .tally .won{box-shadow:inset 0 0 0 3px var(--gold)}

@media (min-width:760px){
  #app{padding-block:18px 22px}
  .game{gap:14px}
  .board{gap:10px;padding:10px}
  .tile{height:clamp(64px,10.5vh,112px)}
  .qcard p{font-size:clamp(26px,3.2vw,38px)}
  .deck{max-width:640px;width:100%;margin:0 auto}
  .buzzers{max-width:520px;margin:0 auto;width:100%}
  .title-screen,.setup,.final{max-width:620px;width:100%;margin:0 auto}
}

const STOP = new Set('a an the to of in on at for and or my your their our his her its they them he she it we i you is are was be been being get gets getting got go going goes went do does doing did just like really some something someone with from up about that this there then than so very too into by as all im theyre were what when where who how lol ok okay um uh'.split(' '));
function norm(s){ return String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/&/g,' and ').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function stem(w){
  if (w.length > 4 && w.endsWith('ies')) w = w.slice(0,-3) + 'y';
  else if (w.length > 5 && w.endsWith('ing')) w = w.slice(0,-3);
  else if (w.length > 4 && w.endsWith('ed')) w = w.slice(0,-2);
  else if (w.length > 4 && w.endsWith('es') && !w.endsWith('ses')) w = w.slice(0,-2);
  else if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0,-1);
  if (w.length > 3 && w[w.length-1] === w[w.length-2]) w = w.slice(0,-1);
  return w;
}
function tokens(s){ return norm(s).split(' ').filter(w => w && !STOP.has(w)).map(stem); }
function near(a, b){
  if (a === b) return true;
  if (Math.min(a.length, b.length) < 5 || Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
function matchAnswer(guess, board){
  const g = tokens(guess);
  const squash = norm(guess).replace(/ /g,'');
  if (!g.length && !squash) return -1;
  let best = -1, bestScore = 0;
  board.a.forEach((ans, idx) => {
    for (const key of [ans.t, ...ans.k]) {
      const kt = tokens(key);
      if (!kt.length) continue;
      const all = kt.every(k => g.some(w => near(w, k)));
      const glued = squash.length >= 3 && squash === norm(key).replace(/ /g,'');
      if (all || glued) {
        const score = kt.length * 10 + norm(key).length;
        if (score > bestScore) { bestScore = score; best = idx; }
      }
    }
  });
  return best;
}

let S = null;

const usedBoards = new Set();

function pickBoards(){
  // JUICY_PER_GAME spicy boards, the juiciest saved for the last (double) round
  let pool = BOARDS.filter(b => !usedBoards.has(b.id));
  if (pool.filter(b => b.spicy).length < JUICY_PER_GAME || pool.length < ROUNDS) { usedBoards.clear(); pool = BOARDS.slice(); }
  const spicy = shuffle(pool.filter(b => b.spicy)).slice(0, JUICY_PER_GAME);
  const rest = shuffle(pool.filter(b => !spicy.includes(b))).slice(0, ROUNDS - spicy.length);
  const picks = [...rest, ...spicy];
  picks.forEach(b => usedBoards.add(b.id));
  return picks;
}

/* ---------------- the countdown clock ---------------- */
const CLOCK = { id:0, end:0, total:0, last:-1 };
const clockHTML = () => `<div class="clock" id="clock" style="--p:1"><b>${CLOCK_SECS[S.phase] || ''}</b></div>`;
function clockStop(){
  CLOCK.id++;
  const m = $('#marquee'); if (m) m.classList.remove('urgent');
  const c = $('#clock'); if (c) c.classList.add('stopped');
}
function clockStart(secs){
  clockStop();
  const c0 = $('#clock'); if (c0) c0.classList.remove('stopped');
  const id = ++CLOCK.id; CLOCK.total = secs; CLOCK.end = performance.now() + secs * 1000; CLOCK.last = -1;
  (function f(now){
    if (id !== CLOCK.id) return;
    const left = Math.max(0, (CLOCK.end - now) / 1000), sec = Math.ceil(left);
    const el = $('#clock');
    if (el) {
      el.style.setProperty('--p', (left / CLOCK.total).toFixed(4));
      el.querySelector('b').textContent = sec;
      el.classList.toggle('warn', left <= Math.min(10, CLOCK.total / 2));
      el.classList.toggle('danger', left <= 3);
    }
    const m = $('#marquee'); if (m) m.classList.toggle('urgent', left <= 3);
    if (sec !== CLOCK.last) {
      CLOCK.last = sec;
      if (sec > 0 && sec <= 3) { SFX.beep(sec); vibe(30); }
      else if (sec > 0 && sec <= 10) SFX.clock(sec <= 5);
    }
    if (left <= 0) { CLOCK.id++; if (m) m.classList.remove('urgent'); timeUp(); return; }
    requestAnimationFrame(f);
  })(performance.now());
}
function timeUp(){ if (!S || !CLOCK_SECS[S.phase]) return; if (S.busy) { setTimeout(timeUp, 300); return; } handleGuess('', true); }

/* ---------------- round flow ---------------- */
function lockDeck(){ clockStop(); const d = $('#deck'); if (d) d.querySelectorAll('button,input').forEach(x => x.disabled = true); }

async function suspense(text, secs, withCrash){
  const m = $('#marquee'); if (!m) return;
  const b = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = `<small>${S.phase === 'steal' ? 'FOR ALL THE POINTS' : 'SURVEY SAYS…'}</small><b>${esc(text)}</b>`;
  m.appendChild(b); m.classList.add('hot');
  SFX.roll(secs, withCrash);
  await wait(reduced ? 200 : secs * 1000);
  b.remove(); m.classList.remove('hot');
}

async function handleGuess(raw, timedOut){
  if (S.busy) return; S.busy = true;
  const guess = String(raw || '').trim().slice(0, 60);
  lockDeck(); S.canUndo = false;
  S.missLabel = timedOut ? "TIME'S UP" : null;
  const steal = S.phase === 'steal';
  if (!timedOut) await suspense(guess, steal ? SUSPENSE_STEAL : SUSPENSE_GUESS, false);
  else { const g = $('#guess'); if (g) g.blur(); }
  const idx = timedOut ? -1 : matchAnswer(guess, S.board);
  const dup = idx >= 0 && S.open.has(idx);
  try {
    if (S.phase === 'fo1' || S.phase === 'fo2') await faceoffResult(idx, dup);
    else if (S.phase === 'play') await playResult(idx, dup);
    else if (S.phase === 'steal') await stealResult(idx, dup);
  } finally { S.busy = false; }
}

  SFX.flip();
  if (!scoring) { await wait(reduced ? 0 : 420); return; }
  await wait(reduced ? 0 : 260);
  tile.classList.add('flash');
  if (!reduced) { const fl = document.createElement('i'); fl.className = 'flare'; tile.appendChild(fl); setTimeout(() => fl.remove(), 900); if (idx === 0) sparks(tile); }
  const plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = '+' + (S.board.a[idx].p * S.mult); tile.appendChild(plus); setTimeout(() => plus.remove(), 1200);
  const pts = S.board.a[idx].p * S.mult;
  if (idx === 0) { SFX.top(); vibe([30, 40, 30, 40, 120]); }
  else { SFX.ding(); vibe(40); }
  await countTo('#bank', S.bank, S.bank + pts); S.bank += pts;
  if (idx === 0) await banner('TOP ANSWER!', `${S.board.a[0].t} · ${pts} points`, '', 1400);
  else await wait(reduced ? 0 : 450);
}

function sparks(tile){
  const r = tile.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i'); p.className = 'spark';
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 160;
    p.style.left = cx + 'px'; p.style.top = cy + 'px';
    document.body.appendChild(p);
    p.animate([{ transform:'translate(-50%,-50%) scale(1)', opacity:1 }, { transform:`translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.2)`, opacity:0 }], { duration:700 + Math.random() * 400, easing:'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
  }
}
function countTo(sel, from, to){
  const el = $(sel); if (!el) return Promise.resolve();
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  if (reduced || from === to) { el.textContent = to; return Promise.resolve(); }
  const dur = Math.min(900, 300 + Math.abs(to - from) * 12), start = performance.now();
  let lastTick = 0;
  return new Promise(res => {
    (function f(now){
      const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (now - lastTick > 70 && p < 1) { SFX.tick(); lastTick = now; }
      if (p < 1) requestAnimationFrame(f); else res();
    })(start);
  });
}

async function faceoffResult(idx, dup){
  const answering = S.phase === 'fo1' ? S.fo.buzz : 1 - S.fo.buzz;
  const hit = idx >= 0 && !dup;
  if (hit) await reveal(idx, true);
  else { SFX.bwomp(); vibe([60, 30, 60]); await showFx(`<div class="xs">${X_SVG}</div><div class="fx-label">${S.missLabel || (dup ? 'ALREADY UP THERE' : 'NOT ON THE BOARD')}</div>`, 900, true); }

  if (S.phase === 'fo1') {
    S.fo.first = hit ? idx : -1;
    if (hit && idx === 0) return wonFaceoff(answering);
    S.phase = 'fo2'; renderDeck(); return;
  }
  const a = S.fo.first, b = hit ? idx : -1;
  if (a < 0 && b < 0) {
    S.fo.misses++;
    if (S.fo.misses >= 2) { const t = Math.random() < .5 ? 0 : 1; await banner('NOBODY HIT IT', `Coin flip: ${S.teams[t].name} gets the board`, 'blue', 1700); return wonFaceoff(t); }
    await banner('NOBODY HIT IT', 'New players up. Buzz again.', 'blue', 1400);
    S.fo.buzz = null; S.fo.first = null; S.phase = 'buzz'; renderDeck(); return;
  }
  let winner;
  if (a < 0) winner = answering; else if (b < 0) winner = S.fo.buzz; else winner = b < a ? answering : S.fo.buzz;
  wonFaceoff(winner);
}

function wonFaceoff(t){
  S.fo.winner = t; S.phase = 'playpass';
  if (allOpen()) return endRound(t, `${S.teams[t].name} CLEARED IT`);
  renderDeck();
}

async function choosePlay(t){
  SFX.tap(); vibe(20);
  S.control = t; S.phase = 'play'; S.strikes = 0;
  renderDeck(); lockDeck();
  await banner(`${S.teams[t].name} PLAYS`, '3 strikes and the other team can steal', t ? '' : 'red', 1200);
  renderDeck();
}

async function playResult(idx, dup){
  if (idx >= 0 && !dup) {
    await reveal(idx, true);
    if (allOpen()) { await banner('BOARD CLEARED!', `${S.teams[S.control].name} keeps the bank`, S.control ? '' : 'red', 1500); return endRound(S.control, `${S.teams[S.control].name} TAKES ${S.bank}`); }
    renderDeck(); return;
  }
  S.strikes++;
  setControlGlow();
  await strikeFx(S.strikes, S.missLabel || (dup ? 'ALREADY ON THE BOARD' : 'NOT ON THE BOARD'));
  S.canUndo = !S.missLabel;
  if (S.strikes >= STRIKES_TO_STEAL) {
    S.phase = 'steal'; setControlGlow(); SFX.steal(); vibe([100, 60, 100]);
    await banner(`${S.teams[1 - S.control].name} CAN STEAL`, `One answer for all ${S.bank} points`, 'blue', 1700);
  }
  renderDeck();
}

function undoStrike(){
  if (!S.canUndo || S.strikes < 1) return;
  SFX.tap(); S.strikes--; S.canUndo = false;
  if (S.phase === 'steal') S.phase = 'play';
  renderDeck();
}

async function stealResult(idx, dup){
  const thief = 1 - S.control;
  if (idx >= 0 && !dup) {
    await reveal(idx, true);
    SFX.win(); vibe([60, 40, 60, 40, 200]);
    await banner('STOLEN!', `${S.teams[thief].name} takes all ${S.bank}`, thief ? '' : 'red', 1700);
    return endRound(thief, `${S.teams[thief].name} STOLE ${S.bank}`);
  }
  await strikeFx(1, S.missLabel || 'NO STEAL');
  await banner('SAVED!', `${S.teams[S.control].name} keeps ${S.bank}`, S.control ? '' : 'red', 1400);
  return endRound(S.control, `${S.teams[S.control].name} HELD ON FOR ${S.bank}`);
}

function allOpen(){ return S.open.size === S.board.a.length; }

function flyPoints(n, team){
  const b = $('#bank'), t = $('#score' + team);
  if (!b || !t || reduced || !n) return Promise.resolve();
  const br = b.getBoundingClientRect(), tr = t.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'flyer t' + team; f.textContent = '+' + n;
  f.style.left = (br.left + br.width / 2) + 'px'; f.style.top = (br.top + br.height / 2) + 'px';
  document.body.appendChild(f); SFX.whoosh();
  const dx = (tr.left + tr.width / 2) - (br.left + br.width / 2), dy = (tr.top + tr.height / 2) - (br.top + br.height / 2);
  const anim = f.animate([
    { transform:'translate(-50%,-50%) scale(.6)', opacity:0 },
    { transform:'translate(-50%,-50%) translateY(-60px) scale(1.5)', opacity:1, offset:.35 },
    { transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.7)`, opacity:1 }
  ], { duration:900, easing:'cubic-bezier(.5,0,.2,1)' });
  return anim.finished.then(() => { f.remove(); SFX.ding(); vibe(40); }).catch(() => f.remove());
}
async function endRound(winner, line){
  S.phase = 'end'; S.endLine = 'THE REST OF THE BOARD'; S.canUndo = false; renderDeck();
  for (let i = 0; i < S.board.a.length; i++) if (!S.open.has(i)) await reveal(i, false);
  await wait(reduced ? 0 : 350);
  const before = S.teams[winner].score;
  S.teams[winner].score += S.bank;
  const teamEl = $('#team' + winner); if (teamEl) teamEl.classList.add('on');
  await flyPoints(S.bank, winner);
  await Promise.all([countTo('#bank', S.bank, 0), countTo('#score' + winner, before, S.teams[winner].score)]);
  SFX.ding();
  S.roundWinner = winner; S.endLine = line; S.phase = 'next'; renderDeck();
}

/* ---------------- final ---------------- */
async function finalScreen(){
  const [a, b] = S.teams;
  const winner = a.score === b.score ? -1 : (a.score > b.score ? 0 : 1);
  app.innerHTML = `<div class="topbar"><span class="ocr"><a class="sound ochome" href="index.html">&larr; HOME</a>${soundBtn()}</span></div><section class="final"><div class="crown">AND THE WINNER IS…</div></section>`;
  wireSound();
  SFX.roll(2.2, true); vibe([20, 30, 20, 30, 20, 30, 20]);
  await wait(reduced ? 300 : 2200);
  const name = winner < 0 ? "IT'S A TIE" : S.teams[winner].name;
  app.querySelector('.final').innerHTML = `
    <div class="crown">${winner < 0 ? 'NOBODY BLINKED' : 'YOUR SURVEY SHOWDOWN CHAMPS'}</div>
    <h2 class="winner ${winner < 0 ? '' : 't' + winner}">${esc(name)}</h2>
    <div class="tally">${S.teams.map((t, i) => `<div class="${i === winner ? 'won' : ''}"><span class="tname" style="color:var(${i ? '--gold' : '--red'})">${esc(t.name)}</span><span class="tscore">${t.score}</span></div>`).join('')}</div>
    <button class="btn red" id="againB">REMATCH</button>
    <button class="btn ghost" id="teamsB">NEW TEAMS</button>`;
  SFX.win(); confetti(); vibe([80, 50, 80, 50, 250]);
  $('#againB').onclick = () => { SFX.tap(); newGame(); };
  $('#teamsB').onclick = () => { SFX.tap(); setupScreen(); };
}

titleScreen();
})();
</script>
