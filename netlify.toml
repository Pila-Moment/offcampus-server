# Netlify reads this. The site is the site/ folder; the Crews API is netlify/functions/api.mjs at /api/*.
[build]
  publish = "site"
  command = "echo 'no build step'"
  functions = "netlify/functions"

# Club games: offcampusontario.ca/club/<name> opens the club page
[[redirects]]
  from = "/club/*"
  to = "/club.html"
  status = 200

# The prize page is retired until real prizes exist (PR 1). Old links go to the home page.
[[redirects]]
  from = "/prizes.html"
  to = "/"
  status = 302
