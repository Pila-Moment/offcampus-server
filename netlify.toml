# Netlify reads this. The site is the site/ folder; the Crews API is netlify/functions/api.mjs at /api/*.
[build]
  publish = "site"
  command = "echo 'no build step'"
  functions = "netlify/functions"

# Club games: offcampusontario.ca/club/<name> opens the club page
[[redirects]]
  from = "/club/*"
  to = "/club.html"
  status = 200
